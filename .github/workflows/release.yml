# Runs when a GitHub release is published (tag vX.Y.Z): builds qqstudio.zip (Windows) and qqstudio.tar.gz
# (macOS/Linux) and attaches them with install.ps1 and install.sh. The install lines download from
# releases/latest/download/, so they always get the newest release. No npm publishing.
name: Release
on:
  release:
    types: [published]

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload files to the release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Release tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then echo "Release tag v$TAG does not match package.json version $VER - bump the version first."; exit 1; fi
      - name: Syntax check
        run: for f in *.js bin/*.js; do node --check "$f"; done
      - name: Point the installers at this repository (forks, a renamed repo)
        run: sed -i "s#quantiqueue/qqstudio#${GITHUB_REPOSITORY}#g" install/install.ps1 install/install.sh
      - name: Build qqstudio.zip and qqstudio.tar.gz
        run: bash .github/scripts/package.sh
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/qqstudio.zip dist/qqstudio.tar.gz install/install.ps1 install/install.sh --clobber
