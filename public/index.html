<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>qqstudio</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#0f1115">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --side:#12151b; --line:#272b35; --text:#e6e8ee; --muted:#8a91a3; --accent:#6aa3ff; --user:#1f2a3d; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
  @media (pointer:coarse) { textarea, input, select { font-size:16px; } } /* iOS zooms into fields smaller than 16px */
  .layout { flex:1; min-height:0; display:flex; }
  select, button, textarea, input { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  button { padding:6px 14px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#0b1020; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }

  /* sidebar */
  aside { width:260px; flex:none; background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  aside .top { padding:10px; border-bottom:1px solid var(--line); }
  .ws-head { display:flex; align-items:center; padding:12px 10px 8px 14px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; border-bottom:1px solid var(--line); }
  .ws-head span { flex:1; }
  button.mini { background:transparent; border:none; color:var(--muted); padding:0 6px; height:22px; font-size:14px; line-height:1; border-radius:6px; }
  button.mini:hover { background:#252a35; color:var(--text); }
  .ws-row { display:flex; align-items:center; gap:2px; margin-top:6px; padding:5px 4px 5px 2px; border-radius:8px; cursor:pointer; color:var(--text); font-size:14px; font-weight:600; }
  .ws-row:hover { background:var(--panel); }
  .ws-row.active { background:var(--user); }
  .ws-row .caret { width:18px; text-align:center; color:var(--muted); font-size:10px; flex:none; }
  .ws-row .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ws-row .mini { visibility:hidden; }
  .ws-row:hover .mini, .ws-row.active .mini { visibility:visible; }
  .ws-row .run-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; margin-right:4px; }
  .ws-row .run-dot.running { animation:pulse 1.2s ease-in-out infinite; } .ws-row .run-dot.waiting { background:#e3b04b; } .ws-row .run-dot.unread { background:#4fc98a; }
  .ws-sessions .chat-item { padding-left:22px; }
  .ws-sessions .empty-list { padding:4px 10px 4px 24px; }
  .logwrap[hidden], #form[hidden], .crumbs[hidden], .wsview[hidden] { display:none !important; }
  /* breadcrumb */
  /* floats over the top-left of the session; takes no space from it */
  .crumbs { position:absolute; top:8px; left:12px; z-index:6; max-width:calc(100% - 40px); display:flex; align-items:center; gap:4px; padding:2px 4px; font-size:13px; color:var(--muted); background:var(--bg); box-shadow:0 0 10px 6px var(--bg); border-radius:8px; min-width:0; }
  .crumbs a { color:var(--muted); text-decoration:none; padding:2px 6px; border-radius:6px; white-space:nowrap; }
  .crumbs a:hover { background:#252a35; color:var(--text); }
  .crumbs .cur { color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* workspace view */
  .wsview { flex:1; min-height:0; overflow-y:auto; padding:24px 16px 40px; }
  .wsview > * { max-width:900px; margin-left:auto; margin-right:auto; }
  .wsv-head { display:flex; align-items:center; gap:10px; }
  .wsv-head h2 { flex:1; margin:0; font-size:22px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .wsv-desc { color:#b8bdca; white-space:pre-wrap; margin-top:8px; line-height:1.5; }
  .wsv-desc.none { color:var(--muted); font-style:italic; }
  .wsview h3 { display:flex; align-items:center; gap:8px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; margin-top:28px; margin-bottom:8px; }
  .wsview h3 .sp { flex:1; }
  .wsview h3 button { text-transform:none; letter-spacing:0; font-weight:400; font-size:12px; padding:3px 10px; }
  .wsv-list { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .wsv-item { display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer; background:var(--panel); }
  .wsv-item + .wsv-item { border-top:1px solid var(--line); }
  .wsv-item:hover { background:#1b1f27; }
  .wsv-item .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wsv-item small { color:var(--muted); white-space:nowrap; }
  .wsv-empty { color:var(--muted); font-size:13px; padding:14px; border:1px dashed var(--line); border-radius:10px; text-align:center; }
  .wsv-files { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; }
  .wsv-file { position:relative; border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden; cursor:pointer; text-decoration:none; color:var(--text); display:flex; flex-direction:column; }
  .wsv-file:hover { border-color:var(--accent); }
  .wsv-file .pv { height:96px; display:flex; align-items:center; justify-content:center; background:#0b0d11; font-size:28px; color:var(--muted); }
  .wsv-file .pv img { max-width:100%; max-height:100%; image-rendering:pixelated; object-fit:contain; }
  .wsv-file .nm { font-size:12px; padding:6px 8px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wsv-file small { font-size:11px; color:var(--muted); padding:0 8px 6px; }
  .wsv-file .del { position:absolute; top:4px; right:4px; visibility:hidden; background:rgba(15,17,21,.85); border:1px solid var(--line); padding:1px 6px; font-size:12px; }
  .wsv-file:hover .del, .wsv-file .del.armed { visibility:visible; }
  .wsv-file .del.armed { color:#f0a3aa; }
  .wsview.drop { outline:2px dashed var(--accent); outline-offset:-8px; }
  /* dialog */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal[hidden] { display:none; }
  .dlg { width:min(460px, calc(100vw - 32px)); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; box-shadow:0 20px 50px rgba(0,0,0,.6); display:flex; flex-direction:column; gap:12px; }
  .dlg h3 { margin:0; font-size:16px; }
  .dlg label { display:flex; flex-direction:column; gap:5px; font-size:13px; color:var(--muted); }
  .dlg label small { font-size:11px; }
  .dlg input, .dlg textarea { padding:8px 10px; font-size:14px; height:auto; resize:vertical; }
  .dlg .row { display:flex; gap:8px; align-items:center; } .dlg .row .sp { flex:1; }
  .dlg .err { color:#f0a3aa; font-size:13px; min-height:0; } .dlg .err:empty { display:none; }
  button.danger { color:#f0a3aa; } button.danger:hover { border-color:#6b2a30; } button.danger.armed { background:#3a1a1d; border-color:#6b2a30; }
  @media (hover:none) { .ws-row .mini, .wsv-file .del { visibility:visible; } }
  #chatList { flex:1; overflow-y:auto; overflow-x:hidden; padding:4px 6px 12px; }
  .group { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:12px 8px 4px; }
  .chat-item { display:flex; align-items:center; gap:2px; padding:6px 6px 6px 10px; border-radius:8px; cursor:pointer; color:#b8bdca; font-size:14px; }
  .chat-item:hover { background:var(--panel); color:var(--text); }
  .chat-item.active { background:var(--user); color:var(--text); }
  .chat-item .run-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; margin-right:6px; }
  .chat-item .run-dot.running { animation:pulse 1.2s ease-in-out infinite; }
  .chat-item .run-dot.waiting { background:#e3b04b; }
  .chat-item .run-dot.unread { background:#4fc98a; }
  @keyframes pulse { 50% { opacity:.3; } }
  .chat-item .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chat-item .act { visibility:hidden; background:none; border:none; padding:1px 5px; color:var(--muted); font-size:13px; }
  .chat-item:hover .act, .chat-item .act.armed { visibility:visible; }
  .chat-item .act:hover { color:var(--text); }
  .chat-item .act.armed { color:#f0a3aa; }
  .chat-item input { flex:1; min-width:0; padding:2px 6px; font-size:14px; }
  .empty-list { color:var(--muted); font-size:13px; padding:14px 10px; }

  /* main */
  .main { flex:1; min-width:0; display:flex; flex-direction:column; position:relative; }
  header { flex:none; display:flex; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1.brand { display:flex; align-items:center; gap:8px; letter-spacing:.01em; }
  header h1.brand img { display:block; }
  header h1 { font-size:15px; margin:0 12px 0 0; font-weight:600; white-space:nowrap; }
  nav { display:flex; gap:4px; margin-right:8px; }
  nav a { color:var(--muted); text-decoration:none; padding:5px 10px; border-radius:8px; font-size:14px; }
  nav a.active, nav a:hover { color:var(--text); background:var(--bg); }
  select { padding:6px 8px; min-width:220px; max-width:340px; }
  a.toolslink { text-decoration:none; padding:5px 10px; color:var(--muted); border:1px solid var(--line); border-radius:8px; }
  a.toolslink:hover { color:var(--text); border-color:var(--accent); }
  label.opt, a.opt { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:4px; white-space:nowrap; }
  #status { color:var(--muted); font-size:13px; margin-left:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .logwrap { flex:1; min-height:0; position:relative; display:flex; flex-direction:column; }
  #log { flex:1; min-height:0; overflow-y:auto; padding:40px 16px 120px; } /* top: room for the floating breadcrumb; bottom: generous space above the composer */
  .jump { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); z-index:5; width:32px; height:32px; padding:0; border-radius:50%; background:var(--panel); border:1px solid var(--line); color:var(--text); font-size:16px; line-height:1; box-shadow:0 2px 10px rgba(0,0,0,.45); }
  .jump:hover { border-color:var(--accent); }
  .jump[hidden] { display:none; }
  @media (hover:none) { .jump { width:40px; height:40px; } }
  #log > * { max-width:900px; margin-left:auto; margin-right:auto; }
  #log > * + * { margin-top:14px; }
  .welcome { color:var(--muted); text-align:center; margin-top:18vh !important; }
  .msg { padding:10px 14px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word; }
  .user { background:var(--user); width:fit-content; max-width:min(80%, 720px); margin-right:max(0px, calc((100% - 900px) / 2)) !important; }
  .assistant { background:var(--panel); border:1px solid var(--line); }
  .error { background:#3a1a1d; border:1px solid #6b2a30; }
  .md { white-space:normal; line-height:1.55; overflow-wrap:anywhere; }
  .md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
  .md p { margin:0 0 .75em; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin:1.1em 0 .45em; line-height:1.3; font-weight:600; }
  .md h1 { font-size:1.45em; } .md h2 { font-size:1.25em; } .md h3 { font-size:1.1em; } .md h4, .md h5, .md h6 { font-size:1em; }
  .md h2 { padding-bottom:.25em; border-bottom:1px solid var(--line); }
  .md ul, .md ol { margin:0 0 .75em; padding-left:1.5em; }
  .md li { margin:.2em 0; } .md li > ul, .md li > ol { margin:.2em 0 0; } .md li > p { margin:0 0 .4em; }
  .md li.task { list-style:none; margin-left:-1.3em; } .md li.task input { margin:0 .35em 0 0; vertical-align:-1px; }
  .md a { color:var(--accent); text-decoration:none; } .md a:hover { text-decoration:underline; }
  .md strong { font-weight:600; color:#f3f4f8; }
  .md hr { border:none; border-top:1px solid var(--line); margin:1em 0; }
  .md blockquote { margin:0 0 .75em; padding:2px 0 2px 12px; border-left:3px solid var(--line); color:#b8bdca; }
  .md code { font:.9em ui-monospace,Consolas,monospace; background:#0b0d11; border:1px solid var(--line); border-radius:4px; padding:.05em .35em; }
  .md .code { margin:0 0 .75em; border:1px solid var(--line); border-radius:8px; background:#0b0d11; overflow:hidden; }
  .md .code-h { display:flex; align-items:center; justify-content:space-between; padding:3px 6px 3px 12px; font-size:12px; color:var(--muted); border-bottom:1px solid var(--line); background:#12151b; }
  .md .code-copy { background:none; border:none; padding:2px 8px; font-size:12px; color:var(--muted); border-radius:6px; cursor:pointer; }
  .md .code-copy:hover { color:var(--text); background:var(--panel); }
  .md pre { margin:0; padding:10px 12px; overflow:auto; max-height:520px; }
  .md pre code { font:12.5px/1.5 ui-monospace,Consolas,monospace; background:none; border:none; padding:0; white-space:pre; color:#c9cede; }
  .md .tbl { margin:0 0 .75em; overflow-x:auto; }
  .md table { border-collapse:collapse; font-size:.95em; }
  .md th, .md td { border:1px solid var(--line); padding:5px 10px; text-align:left; vertical-align:top; }
  .md th { background:#12151b; font-weight:600; }
  .md img { max-width:100%; max-height:420px; border-radius:8px; border:1px solid var(--line); cursor:zoom-in; vertical-align:middle; }
  .hl-kw { color:#ff7b72; } .hl-str { color:#a5d6ff; } .hl-num, .hl-lit { color:#79c0ff; } .hl-com { color:#8b949e; font-style:italic; }
  .hl-fn { color:#d2a8ff; } .hl-ty, .hl-var { color:#ffa657; } .hl-bi { color:#79c0ff; } .hl-meta { color:#d2a8ff; } .hl-tag { color:#7ee787; } .hl-attr { color:#79c0ff; }
  .hl-ins { color:#aff5b4; background:rgba(46,160,67,.15); display:inline-block; min-width:100%; } .hl-del { color:#ffdcd7; background:rgba(248,81,73,.15); display:inline-block; min-width:100%; }
  /* Fold: thinking, tool calls and narration between two replies, collapsed into one line. */
  details.fold > summary { list-style:none; cursor:pointer; color:var(--muted); font-size:13px; display:flex; align-items:center; gap:8px; padding:0 14px; user-select:none; }
  details.fold > summary::-webkit-details-marker { display:none; }
  details.fold > summary:hover { color:var(--text); }
  details.fold > summary .car { font-size:10px; width:10px; transition:transform .15s; }
  details.fold[open] > summary .car { transform:rotate(90deg); }
  details.fold > summary .spin { display:inline-block; vertical-align:-2px; width:10px; height:10px; margin-right:7px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  .fold-body { display:flex; flex-direction:column; gap:10px; margin:10px 0 0 19px; padding-left:12px; border-left:2px solid var(--line); }
  .fold-body > .thoughts + .msg.assistant { margin-top:-4px; }
  .thoughts { padding:0 14px; }
  .thoughts .think { margin:8px 0 0; }
  #log > .thoughts + .msg.assistant { margin-top:8px; }
  /* a reply box with nothing in it yet (only thinking so far) stays hidden */
  .msg.assistant:not(:has(.phase)):not(:has(.meta)):not(:has(.activity)):has(> .md:empty):not(.error) { display:none; }
  details.compacted > summary { list-style:none; display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; cursor:pointer; }
  details.compacted > summary::-webkit-details-marker { display:none; }
  details.compacted > summary .line { flex:1; height:1px; background:var(--line); }
  details.compacted > summary:hover .lbl { color:var(--text); }
  details.compacted .csum { margin-top:10px; padding:10px 14px; border:1px dashed var(--line); border-radius:10px; color:#b8bdca; font-size:13px; }
  .uwrap.pending .msg.user { opacity:.7; border:1px dashed #3b4356; }
  .uwrap.pending .acts { display:none; }
  .uwrap .ptag { font-size:11px; color:var(--muted); text-align:right; margin-top:4px; }
  /* The session's task list (todo tool), above the message box. */
  .todo-panel { margin-bottom:8px; border:1px solid var(--line); border-radius:10px; background:var(--panel); font-size:13px; }
  .todo-panel .th { display:flex; align-items:center; gap:8px; padding:6px 12px; cursor:pointer; color:var(--muted); user-select:none; }
  .todo-panel .th:hover { color:var(--text); } .todo-panel .th .car { font-size:10px; width:10px; transition:transform .15s; } .todo-panel.open .th .car { transform:rotate(90deg); }
  .todo-panel ul { list-style:none; margin:0; padding:0 12px 8px 30px; display:none; } .todo-panel.open ul { display:block; }
  .todo-panel li { padding:2px 0; display:flex; gap:8px; } .todo-panel li .st { width:14px; flex:none; text-align:center; color:var(--muted); }
  .todo-panel li.done { color:var(--muted); text-decoration:line-through; } .todo-panel li.in_progress { font-weight:600; } .todo-panel li.in_progress .st { color:var(--accent); }
  /* Under a reply: "330 tokens in 1m 2s" while it runs (pulsing dot), "Generated 1,337 tokens in 3m 40s" when done. */
  .runfoot { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; padding:0 14px; font-variant-numeric:tabular-nums; }
  .runfoot .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; animation:runpulse 1.4s ease-in-out infinite; }
  @keyframes runpulse { 0%, 100% { opacity:.25; transform:scale(.8); } 50% { opacity:1; transform:scale(1); } }
  .stopline { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; padding:0 14px; }
  .stopline button { font-size:12px; padding:3px 12px; }
  .think { color:var(--muted); font-size:13px; border-left:2px solid var(--line); padding-left:10px; margin-bottom:8px; white-space:pre-wrap; }
  .meta { color:var(--muted); font-size:12px; margin-top:6px; display:flex; align-items:center; gap:8px; min-height:22px; }
  .uwrap { display:flex; flex-direction:column; align-items:flex-end; }
  .uwrap .user { margin-right:0 !important; }
  .acts { display:flex; gap:2px; opacity:0; transition:opacity .15s; }
  .uwrap .acts { margin-top:3px; }
  .meta .acts { margin-left:auto; }
  .uwrap:hover .acts, .assistant:hover .acts, .acts:focus-within { opacity:1; }
  .acts button { background:none; border:none; padding:2px 8px; font-size:12px; color:var(--muted); border-radius:6px; }
  .acts button:hover { color:var(--text); background:var(--panel); }
  .assistant .acts button:hover { background:var(--bg); }
  /* Touch screens have no hover: always show message actions and chat delete buttons, with bigger tap targets. */
  @media (hover:none) {
    .acts { opacity:1; }
    .acts button { padding:6px 10px; font-size:13px; }
    .chat-item .act { visibility:visible; }
    .md .code-copy { padding:5px 10px; }
  }
  .phase { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }
  .phase + * { margin-top:6px; }
  .phase .spin { width:12px; height:12px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; flex:none; }
  summary.think-sum .spin { display:inline-block; vertical-align:-2px; width:10px; height:10px; margin-right:7px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  .activity { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; margin-top:8px; font-variant-numeric:tabular-nums; }
  .activity .spin { width:10px; height:10px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; flex:none; }
  .md:empty + .activity { margin-top:0; }
  .phase .bar { width:120px; height:4px; background:var(--bg); border-radius:2px; overflow:hidden; }
  .phase .bar > div { height:100%; background:var(--accent); width:0; transition:width .3s; }
  @keyframes spin { to { transform:rotate(360deg); } }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; }
  .tool { border:1px solid var(--line); border-radius:10px; padding:6px 12px; font-size:13px; background:#12151b; }
  .tool > details > summary { list-style:none; display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--text); font-size:13px; }
  .tool > details > summary::-webkit-details-marker { display:none; }
  .tool > details > summary::before { content:"▸"; color:var(--muted); font-size:11px; width:10px; }
  .tool > details[open] > summary::before { content:"▾"; }
  .tool .name { font-family:ui-monospace,Consolas,monospace; color:var(--accent); flex:none; }
  .tool .sum { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; }
  .tool .lbl { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin-top:8px; }
  .media { margin-top:8px !important; }
  .media .imgs { margin-top:0; }

<script>
// Requests from this page give up after a while (reads 8 s, changes 60 s), so a stuck request frees its connection
// and the next poll can try again. Browsers allow only a few connections per server.
(() => {
  const f = window.fetch.bind(window);
  window.fetch = (u, o = {}) => o.signal ? f(u, o) : f(u, { ...o, signal: AbortSignal.timeout(!o.method || o.method === "GET" ? 8000 : 60000) });
})();

const $ = (id) => document.getElementById(id);
let workspaces = [], defaultWs = "Default", wsView = null; // wsView: id of the workspace shown in the main area, or null for a session
const SEND_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const STOP_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg>';
const log = $("log"), input = $("input"), sendBtn = $("send"), modelSel = $("model"), status = $("status");
const MAX_STEPS = 25;

// chat = { id, title, created, updated, model, messages[] }
// messages are OpenAI-format; keys starting with "_" are UI-only (reasoning, meta, images, status) and are
// stripped before sending to the model.
let chat = blankChat();
let chatList = [];
let renaming = false;
let running = false, pendingApproval = null, listTimer = null;
let toolInfo = { enabled: true, tools: [], roots: [], platform: "" };

// The effort and thinking new sessions start at (Settings > Sessions); var, as sessions are created before the config loads.
var newEffort = "medium", newBudget = "unlimited";
function blankChat(workspace) { return { id: null, workspace: workspace || defaultWs, title: "New session", mode: "manual", effort: newEffort || "medium", thinkBudget: newBudget || "unlimited", skills: {}, mcp: {}, cats: {}, messages: [] }; }
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function el(tag, cls, text) { const d = document.createElement(tag); if (cls) d.className = cls; if (text != null) d.textContent = text; return d; }
function add(node) {
  log.querySelector(".welcome")?.remove();
  log.insertBefore(node, foot && foot.el.isConnected ? foot.el : null); // the live reply footer stays at the bottom
  if (fold && fold.live && node !== fold.el) foldLive(fold, false); // shown outside the fold: its work is done
  follow(); return node;
}
// ---------- reply footer: tokens generated and time since the reply started (all steps; keeps counting while it waits
// for an approval or a tool) ----------
let foot = null; // { el, t0, tokens, timer } while a reply runs
const fmtDur = (ms) => { const s = Math.floor(ms / 1000); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`; };
const fmtTok = (n) => `${(n || 0).toLocaleString("en-US")} token${n === 1 ? "" : "s"}`;
function footStart(ms = 0, tokens = 0) {
  footStop();
  const e = el("div", "runfoot");
  e.appendChild(el("span", "dot")); e.appendChild(el("span"));
  log.appendChild(e);
  foot = { el: e, t0: performance.now() - ms, tokens };
  const draw = () => { if (foot) foot.el.lastChild.textContent = `${fmtTok(foot.tokens)} in ${fmtDur(performance.now() - foot.t0)}`; };
  foot.draw = draw; draw();
  foot.timer = setInterval(draw, 500);
  follow();
}
function footTokens(n) { if (foot && n >= foot.tokens) { foot.tokens = n; foot.draw(); } }
function footStop() { if (foot) { clearInterval(foot.timer); foot = null; } }
const footDone = (stat) => el("div", "runfoot", `Generated ${fmtTok(stat.tokens)} in ${fmtDur(stat.ms)}`);
// The reply ended: the live footer becomes "Generated … in …" (the server's totals when given).
// ---------- ask_user: the model's questions, answered by clicking options (or typing a message) ----------
let pendingQuestion = null; // { id, card, sendText(text) } while a reply waits for answers
// questions: [{question, header, multiple, options: [{label, description, recommended}]}]
// done: { answers: [{choices, other}] } or { text } shows it answered (a short summary); onSubmit(answer) for a live card,
// which shows one question at a time ("Question 1 / 3"): picking an option of a single-choice question moves on.
function questionCard(questions, done, onSubmit) {
  const card = el("div", "qcard" + (done ? " done" : " pending"));
  if (done) {
    card.appendChild(el("div", "qh", "Questions"));
    if (done.text) { const own = card.appendChild(el("div", "own", "Answered in your own words: ")); own.appendChild(el("b", null, done.text)); return card; }
    questions.forEach((q, i) => {
      const a = done.answers?.[i] || {}, parts = [...(a.choices || [])];
      if (a.other) parts.push(`“${a.other}”`);
      const row = card.appendChild(el("div", "qsum"));
      row.appendChild(el("span", "qq", q.question));
      row.appendChild(el("span", "qv", parts.join(", ") || "no answer"));
    });
    return card;
  }
  const state = questions.map(() => ({ picks: new Set(), other: "" }));
  const answered = (s) => s.picks.size > 0 || !!s.other.trim();
  let at = 0;
  const head = card.appendChild(el("div", "qh"));
  const body = card.appendChild(el("div", "q"));
  const row = card.appendChild(el("div", "qa"));
  const back = row.appendChild(el("button", null, "Back")); back.type = "button";
  const next = row.appendChild(el("button", "primary")); next.type = "button";
  row.appendChild(el("span", "muted", "or type your answer in the message box"));
  const last = () => at === questions.length - 1;
  const sync = () => { next.textContent = last() ? "Send answers" : "Next"; next.disabled = last() ? !state.every(answered) : !answered(state[at]); };
  const go = (i) => { at = i; show(); };
  function show() {
    const q = questions[at], s = state[at];
    head.textContent = (questions.length > 1 ? `Question ${at + 1} / ${questions.length}` : "Question") + (q.header ? ` · ${q.header}` : "") + " · waiting for your answer";
    body.innerHTML = "";
    const qt = body.appendChild(el("div", "qt", q.question));
    if (q.multiple) qt.appendChild(el("small", null, "pick any"));
    const opts = body.appendChild(el("div", "opts")), btns = [];
    q.options.forEach((o) => {
      const b = opts.appendChild(el("button", "opt" + (s.picks.has(o.label) ? " sel" : ""))); b.type = "button";
      b.appendChild(el("span", "lb", o.label));
      if (o.recommended) b.appendChild(el("span", "rec", "Recommended"));
      if (o.description) b.appendChild(el("span", "ds", o.description));
      b.onclick = () => {
        if (q.multiple) s.picks.has(o.label) ? s.picks.delete(o.label) : s.picks.add(o.label);
        else { s.picks = new Set([o.label]); s.other = ""; other.value = ""; }
        btns.forEach((x, k) => x.classList.toggle("sel", s.picks.has(q.options[k].label)));
        sync();

// ---------- chat persistence ----------
async function loadList() {
  try { chatList = (await (await fetch("/api/chats")).json()).chats || []; } catch { chatList = []; }
  if (!renaming) renderList();
  if (wsView && !renaming) renderWsView();
  clearTimeout(listTimer); // keep the sidebar's "reply in progress" dots current
  if (chatList.some((c) => c.running)) listTimer = setTimeout(loadList, 3000);
}

async function saveChat(c = chat) {
  if (!c.id) { c.id = newId(); c.created = Date.now(); if (c === chat) setHash(c.id); }
  c.updated = Date.now();
  c.model = modelSel.value || c.model;
  try {
    await fetch(`/api/chats/${c.id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(c) });
  } catch (e) { status.textContent = "save failed: " + e.message; }
  loadList();
}


async function newChat(workspace) {
  detach(); // a running reply keeps going on the server
  chat = blankChat(workspace || curWs()?.id);
  showSessionUi();
  renderMode();
  renderThink();
  renderToolbarState();
  setHash("");
  showWelcome();
  renderList();
  input.focus();
}

async function loadChat(id) {
  detach();
  try {
    const r = await fetch(`/api/chats/${id}`);
    if (!r.ok) throw new Error("not found");
    chat = await r.json();
  } catch (e) {
    status.textContent = "Could not open session: " + e.message;
    return openWorkspace(defaultWs);
  }
  chat.workspace = chat.workspace || defaultWs;
  showSessionUi();
  setHash(chat.id);
  if (chat.unread) { delete chat.unread; fetch(`/api/chats/${chat.id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ unread: false }) }).then(loadList).catch(() => {}); }
  renderMode();
  renderThink();
  renderToolbarState();
  if (chat.model && [...modelSel.options].some((o) => o.value === chat.model)) modelSel.value = chat.model;
  renderChat();
  renderList();
  input.focus();
  const { active = [] } = await fetch("/api/runs").then((r) => r.json()).catch(() => ({}));
  if (active.includes(id) && chat.id === id) attach(id);
}

async function deleteChat(id) {
  await stopAndWait(id);
  await fetch(`/api/chats/${id}`, { method: "DELETE" }).catch(() => {});
  const wasWs = chatList.find((c) => c.id === id)?.workspace || defaultWs;
  if (id === chat.id && !wsView) { await loadList(); return openWorkspace(wasWs); }
  loadList();
}

function startRename(item, c) {
  renaming = true;
  const span = item.querySelector(".t");
  const inp = el("input"); inp.value = c.title || "";
  span.replaceWith(inp);
  item.querySelectorAll(".act").forEach((b) => (b.style.display = "none"));
  inp.focus(); inp.select();
  let done = false;
  const finish = async (save) => {
    if (done) return; done = true; renaming = false;
    const title = inp.value.trim();
    if (save && title && title !== c.title) {
      await fetch(`/api/chats/${c.id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title }) });
      if (c.id === chat.id) { chat.title = title; renderCrumbs(); }
    }
    loadList();
  };
  inp.onkeydown = (e) => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); };
  inp.onblur = () => finish(true);
  inp.onclick = (e) => e.stopPropagation();
}

// ---------- agent runs ----------
// The loop runs on the server (runs.js), so a reply survives switching chats, opening Settings or closing the tab.
// This page starts a run, watches it through an event stream (EventSource), answers approvals and can stop it.
let es = null, live = null, cards = new Map();

function setBusy(busy) {
  window.harnessBusy = busy;
  if (!busy && window.harnessReloadPending) return location.reload(); // hot reload deferred during a reply
  updateSendState();
  modelSel.disabled = busy;
}

// Leaving the page: close the run's event stream so it doesn't hold a connection (the run keeps going on the server).
addEventListener("pagehide", () => { if (es) { es.close(); es = null; } });
// Stop watching (the run itself keeps going on the server).
function detach() {
  if (es) { es.close(); es = null; }
  live = null; pendingApproval = null; running = false;
  setBusy(false);
}

function attach(id) {
  if (es) es.close();
  const src = new EventSource(`/api/runs/${encodeURIComponent(id)}/events`);
  es = src; running = true; setBusy(true);
  src.onmessage = (e) => {
    if (es !== src || chat.id !== id) return;
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    onRunEvent(ev, id);
  };
  // CLOSED = no run any more (204) or the server is gone for good; show what was saved.
  src.onerror = () => { if (es === src && src.readyState === EventSource.CLOSED) { es = null; endRun(id, true); } };
}

async function endRun(id, reload) {
  if (steerContinue === id) { // stopped with steers pending: they were added to the session; reply to them now
    steerContinue = null;
    setTimeout(() => { if (chat.id === id && !running) startRun(chat); }, 50);
  }
  if (liveUsage?.chat === id) { liveUsage = null; setTimeout(updateCtx); } // saved messages carry the exact counts now
  if (live?.box) live.box.finish(live.content || "", ""); // a step the server ended without a reply: stop its timers
  footEnd(null); // ended without a "done" (e.g. the connection closed)
  foldClose();
  pendingQuestion = null;
  live = null; pendingApproval = null; running = false;
  setBusy(false);
  loadList();
  if (reload && chat.id === id) {
    try { const c = await (await fetch(`/api/chats/${id}`)).json(); if (chat.id === id) { chat.messages = c.messages || []; renderChat(); } } catch {}
  }
  if (chat.id === id) input.focus();
}

function liveStep() {
  live = live || {};
  live.box = assistantBox(); live.content = ""; live.reasoning = "";
  return live.box;
}
function tcById(id) {
  for (const m of chat.messages) for (const tc of m.tool_calls || []) if (tc.id === id) return tc;
  return { id, function: { name: "tool", arguments: "" } };
}
function liveTool(tc, status) {
  let t = cards.get(tc.id);
  if (!t) { const sc = shownCall(tc); t = toolCard(sc.name, sc.args); cards.set(tc.id, t); }
  if (status === "approval" && !t.asking) {
    t.asking = true;
    promote(t.node); // needs you: shown outside the fold
    t.badge("needs approval");
    const id = chat.id;
    t.approve().then((ok) => {
      t.asking = false;
      if (ok) t.badge("running…");
      fetch(`/api/runs/${encodeURIComponent(id)}/approve`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: tc.id, approved: ok }) }).catch(() => {});
    });
  } else if (status === "running") t.badge("running…");
  return t;
}

function onRunEvent(ev, id) {
  switch (ev.type) {
    case "snapshot": {
      chat.messages = ev.messages || [];
      renderChat(true);
      live = {};
      if (ev.cur) {
        const b = liveStep();
        live.content = ev.cur.content || ""; live.reasoning = ev.cur.reasoning || "";
        if (live.reasoning) b.thinking(live.reasoning);
        if (live.content) b.content(live.content);
        else if (ev.cur.phase && !ev.cur.gen?.tool) b.phase(ev.cur.phase, ev.cur.pct);
        if (ev.cur.gen) b.activity(ev.cur.gen.n, ev.cur.gen.tool || "", ev.cur.gen.ms);
      }
      if (ev.tool) liveTool(ev.tool.tc, ev.tool.status);
      if (ev.question) liveQuestion(ev.question);
      if (live.box && live.content) promote(live.box.node); // text streaming right now
      if (fold && lastChild() === fold.el) foldLive(fold, true);
      if (ev.stat) footStart(ev.stat.ms, ev.stat.tokens);
      pendingEls.clear();
      for (const p of ev.pending || []) pendingBubble(p);
      break;
    }
    case "step": liveStep().phase("Sending request"); foldLive(foldOf(live.box.node), true); break;
    case "phase": if (live?.box && !live.content && !ev.text.startsWith("Preparing tool call")) live.box.phase(ev.text, ev.pct); break; // tool calls show in the activity line
    case "delta": {
      const b = live?.box || liveStep();
      if (ev.r) { live.reasoning += ev.r; b.thinking(live.reasoning); }
      if (ev.c) { live.content += ev.c; b.content(live.content); b.clearPhase(); promote(b.node); } // text is always shown
      if (ev.n) b.activity(ev.n, ev.tool || "");
      if (ev.tot != null) footTokens(ev.tot);
      follow();
      break;
    }
    case "assistant": {
      const m = ev.msg;
      chat.messages.push(m);
      const b = live?.box || liveStep();
      if (m._thinkSecs != null) b.setThinkSecs(m._thinkSecs);
      b.setBudgetHit(!!m._budgetHit);
      b.finish(m.content || "", m._meta);
      if (m.content) promote(b.node);
      live.box = null;
      if (ev.tot != null) footTokens(ev.tot);
      break;
    }
    case "failed": { const b = live?.box || liveStep(); b.error(ev.text); promote(b.node); if (live) live.box = null; break; }
    case "tool": liveTool(ev.tc, ev.status); break;
    case "question": liveQuestion(ev); break;
    case "todo": chat.todo = ev.items; renderTodo(); break;
    case "answered": answeredQuestion(ev.id, ev.answers); break;
    case "tool_result": {
      const m = ev.msg;
      chat.messages.push(m);
      if (m._answers || qCards.has(m.tool_call_id)) { // ask_user: the card already shows the answers (or cancelled)
        if (m._answers) answeredQuestion(m.tool_call_id, m._answers);
        else { const q = qCards.get(m.tool_call_id); q.card.className = "qcard done"; q.card.innerHTML = ""; q.card.appendChild(el("div", "qh", "Questions · " + (m._status || "cancelled"))); if (pendingQuestion?.id === m.tool_call_id) pendingQuestion = null; }
        follow();
        break;
      }
      const t = liveTool(tcById(m.tool_call_id));
      const st = m._status || "done";
      t.badge(st);
      if (st !== "denied" && st !== "cancelled") t.result(m.content, m._images);
      if (QUIET_TOOLS.has(shownCall(tcById(m.tool_call_id)).name) && st === "done" && m._images?.length) t.hide();
      follow();
      break;
    }
    case "loaded": chat.loaded = ev.loaded; renderToolbarState(); renderPlus(); break;
    case "halted": add(stopLine(ev.text)); break;
    case "steer_pending": if (!pendingEls.has(ev.id)) { pendingBubble(ev); follow(); } break; // sent from another tab
    case "steer_applied": {
      chat.messages.push(ev.msg);
      for (const sid of ev.ids) { pendingEls.get(sid)?.remove(); pendingEls.delete(sid); }
      userBubble(ev.msg); follow(); // now part of the conversation, in its place
      if (ev.leftover) steerContinue = id;
      break;
    }
    case "compacted": chat.messages.splice(ev.at, 0, ev.msg); if (live?.box) { live.box.clearPhase(); live.box.finish("", ""); live.box = null; } add(summaryDivider(ev.msg)); updateCtx(); break;
    case "notice": add(el("div", "msg error", ev.text)); break;
    case "usage":
      lastUsage = { prompt: ev.prompt, completion: ev.completion, model: ev.model };
      liveUsage = { chat: id, prompt: ev.prompt, completion: ev.completion }; updateCtx(); break;
    case "done": {
      const lastA = [...chat.messages].reverse().find((m) => m.role === "assistant");
      if (lastA && ev.ms != null) lastA._run = { tokens: ev.tokens, ms: ev.ms };
      footEnd(ev);
      if (es) { es.close(); es = null; } endRun(id, false); break;
    }
  }
}

async function startRun(c) {
  running = true; setBusy(true);
  try {
    await saveChat(c);
    await loadTools(); // pick up changes made in Settings
    const specs = activeTools(), deferred = deferredGroups();
    const pinned = (await Promise.all(skillList.filter((x) => skillMode(x.name) === "on")
      .map((x) => fetch("/api/skills/get?name=" + encodeURIComponent(x.name)).then((r) => (r.ok ? r.json() : null)).catch(() => null)))).filter(Boolean);
    const tp = thinkParams(c);
    const r = await fetch("/api/runs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
      chatId: c.id, model: modelSel.value, system: systemPrompt(specs, pinned, deferred), tools: specs.map((s) => s.spec),
      deferred: deferred.map((g) => ({ key: g.key, name: g.name, note: g.note, tools: g.tools.map((t) => t.spec) })),
      think: { body: tp.body, budget: tp.budget, message: thinkCfg.message },
    }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    if (chat.id === c.id) attach(c.id); else { running = false; setBusy(false); }
    loadList();
  } catch (e) {
    add(el("div", "msg error", "Could not start the reply: " + e.message));
    running = false; setBusy(false);
  }
}

async function send() {
  const text = input.value.trim();
  if (attachments.some((a) => a.busy)) { status.textContent = "Waiting for the image to finish attaching…"; return; }
  const imgs = attachments.map((a) => ({ src: a.src, full: a.src }));
  if ((!text && !imgs.length) || running) return;
  input.value = ""; autosize();
  attachments = []; renderAttachments();
  const c = chat;
  if (!c.messages.some((m) => m.role === "user")) { c.title = (text || "Image").replace(/\s+/g, " ").slice(0, 60); if (c === chat) setTimeout(renderCrumbs); }
  const um = { role: "user", content: text };
  if (imgs.length) um._images = imgs;
  c.messages.push(um);
  userBubble(um);
  toBottom();
  await startRun(c);
}

// ---------- steering ----------
// A message sent while a reply runs is "pending": the server adds it after the current step, before the next model call.
const pendingEls = new Map(); // steer id -> bubble
let steerContinue = null;      // session id whose stopped reply left steers behind: start a new reply with them
function pendingBubble(p) {
  const m = { role: "user", content: p.text || "" };
  if (p.images?.length) m._images = p.images;
  const w = userBubble(m);
  w.classList.add("pending");
  const tag = w.appendChild(el("div", "ptag", "pending"));
  tag.title = "The model sees this after its current step";
  pendingEls.set(p.id, w);
  return w;
}
async function steer() {
  if (attachments.some((a) => a.busy)) { status.textContent = "Waiting for the image to finish attaching…"; return; }
  const text = input.value.trim(), images = attachments.map((a) => ({ src: a.src, full: a.src }));
  if (pendingQuestion && text && !images.length) { input.value = ""; autosize(); pendingQuestion.sendText(text); return; } // answers the questions
  if (!text && !images.length) return;
  const id = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), sid = chat.id;
  input.value = ""; attachments = []; renderAttachments(); autosize();
  pendingBubble({ id, text, images }); toBottom();
  try {
    const r = await fetch(`/api/runs/${sid}/steer`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, text, images }) });
    if (r.status === 409) { // the reply ended just now: send it as a normal message instead
      pendingEls.get(id)?.remove(); pendingEls.delete(id);
      for (let i = 0; i < 50 && running; i++) await new Promise((res) => setTimeout(res, 100));
      if (chat.id !== sid) return;
      input.value = text; attachments = images.map((im) => ({ src: im.src, preview: im.src })); renderAttachments();
      return send();
    }
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  } catch (e) {
    pendingEls.get(id)?.remove(); pendingEls.delete(id);
    status.textContent = "Could not send: " + e.message;
    input.value = text; autosize();
  }
}

// Retry: drop everything after this prompt and run it again.
async function retry(msg) {
  await stopAndWait();
  const c = chat;
  const i = c.messages.indexOf(msg);
  if (i < 0) return;
  c.messages = c.messages.slice(0, i + 1);
  renderChat();
  await startRun(c);
}

function stop() {
  if (pendingApproval) pendingApproval(false);
  if (chat.id) fetch(`/api/runs/${encodeURIComponent(chat.id)}/stop`, { method: "POST" }).catch(() => {});
}
// Stops this chat's run on the server and waits until it has finished saving.
async function stopAndWait(id = chat.id) {
  if (!id) return;
  await fetch(`/api/runs/${encodeURIComponent(id)}/stop`, { method: "POST" }).catch(() => {});
  for (let i = 0; i < 200; i++) {
    const { active = [] } = await fetch("/api/runs").then((r) => r.json()).catch(() => ({}));
    if (!active.includes(id)) break;
    await new Promise((r) => setTimeout(r, 100));
  }
  if (chat.id === id) detach();
}

function seg(values, current, onPick) {
  const g = el("div", "seg sm");
  for (const [v, label, title] of values) {
    const b = g.appendChild(el("button", v === current ? "on" : "", label));
    b.type = "button"; b.dataset.v = v; b.title = title;
    b.onclick = (e) => { e.stopPropagation(); onPick(v); };
  }
  return g;
}
function renderPlus() {
  const m = $("plusMenu");
  if (m.hidden) return;
  m.innerHTML = "";
  const MODES3 = (what) => [["auto", "Auto", `Model ${what} when relevant`], ["on", "On", "Always available"], ["off", "Off", "Not available in this session"]];
  const tag = (r, text) => r.querySelector(".nm").appendChild(el("small", "tag", text));
  m.appendChild(el("h4", null, "Skills"));
  if (!skillList.length) { const e = m.appendChild(el("div", "pm-empty")); e.innerHTML = 'No skills enabled. <a href="/settings#skills">Add skills</a>'; }
  for (const s of skillList) {
    const r = m.appendChild(el("div", "pm-row"));
    const nm = r.appendChild(el("span", "nm", s.name)); nm.title = s.description;
    r.appendChild(seg(MODES3("loads it"), skillMode(s.name), (v) => patchChat({ skills: { ...(chat.skills || {}), [s.name]: v } })));
  }
  // Picking Auto or Off for a group the model had turned on puts it back to "not loaded".
  const pickGroup = (field, name, key, v) => patchChat({ [field]: { ...(chat[field] || {}), [name]: v }, ...(isLoaded(key) && v !== "on" ? { loaded: chat.loaded.filter((x) => x !== key) } : {}) });
  m.appendChild(el("h4", null, "MCP servers"));
  if (!mcpServers.length) { const e = m.appendChild(el("div", "pm-empty")); e.innerHTML = 'None configured. <a href="/settings#mcp">Add MCP servers</a>'; }
  for (const sv of mcpServers) {
    const key = "mcp:" + sv.name, mode = mcpMode(sv.name);
    const r = m.appendChild(el("div", "pm-row" + (sv.status === "ready" ? "" : " dis")));
    r.appendChild(el("span", "d " + sv.status));
    const nm = r.appendChild(el("span", "nm", sv.name)); nm.title = sv.description || "";
    nm.appendChild(el("small", null, sv.status === "ready" ? `${sv.tools.length} tools` : sv.status));
    if (mode === "auto" && isLoaded(key)) tag(r, "loaded");
    r.appendChild(seg(MODES3("turns it on"), mode, (v) => pickGroup("mcp", sv.name, key, v)));
  }
  m.appendChild(el("h4", null, "Tools"));
  for (const cat of CATS) {
    const key = "cat:" + cat, mode = catMode(cat);
    const allowed = toolInfo.tools.filter((t) => !t.server && t.category === cat && t.enabled).length;
    const usable = allowed && toolInfo.enabled !== false;
    const r = m.appendChild(el("div", "pm-row" + (usable ? "" : " dis")));
    const nm = r.appendChild(el("span", "nm", cat));
    nm.appendChild(el("small", null, usable ? `${allowed} tool${allowed > 1 ? "s" : ""}` : "off in Settings"));
    if (usable && mode === "auto" && isLoaded(key)) tag(r, "loaded");
    if (usable) r.appendChild(seg(MODES3("turns it on"), mode, (v) => pickGroup("cats", cat, key, v)));
  }
  const f = m.appendChild(el("div", "pm-foot"));
  f.innerHTML = 'These apply to this session only. Manage what is installed in <a href="/settings#tools">Settings</a>.';
}
$("plus").onclick = (e) => { e.stopPropagation(); togglePlus(); };
$("plusMenu").onclick = (e) => e.stopPropagation();
document.addEventListener("click", () => { if (!$("plusMenu").hidden) togglePlus(false); if (!$("modeMenu").hidden) toggleMode(false); if (!$("effortMenu").hidden) toggleEffort(false); });
document.addEventListener("keydown", (e) => { if (e.key !== "Escape") return; if (!$("plusMenu").hidden) togglePlus(false); if (!$("modeMenu").hidden) toggleMode(false); if (!$("effortMenu").hidden) toggleEffort(false); });

// ---------- context meter ----------
let lastUsage = null, liveUsage = null, ctxSize = {}, ctxTimer = null; // liveUsage: exact counts from the run in progress
const estTokens = (str) => Math.ceil(str.length / 3.6);
const fmtK = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n));
// Tool definitions sent with each request. Large MCP servers are "on request" (lazytools.js): a compact list (about
// 22 tokens a tool) plus tool_info/call_tool instead of every definition; tools the session uses a lot get full details.
function toolTokens(specs) {
  const at = toolInfo.lazyAt || 0, size = toolInfo.serverTokens || {}, full = new Set(chat.promoted || []);
  const onRequest = (t) => t.server && at > 0 && (size[t.server] || 0) >= at && !full.has(t.name);
  const sent = specs.filter((t) => !onRequest(t)), n = specs.length - sent.length;
  return estTokens(JSON.stringify(sent.map((t) => t.spec))) + (n ? 300 + n * 22 : 0);
}
function updateCtx() {
  clearTimeout(ctxTimer);
  ctxTimer = setTimeout(async () => {
    const specs = activeTools();
    const pinnedChars = skillList.filter((s) => skillMode(s.name) === "on").length * 1500; // rough until loaded
    const sys = estTokens(systemPrompt(specs, [])) + toolTokens(specs) + Math.ceil(pinnedChars / 3.6);
    const model = modelSel.value;
    // Exact when possible: llama-server's count for the last request in this session (prompt + what it wrote), plus an
    // estimate of only what came after it. Images count roughly 1,000 tokens each for a vision model.
    const imgTok = (ms) => modelVision[model] ? ms.reduce((n, m) => n + (m._images?.length || 0), 0) * 1000 : 0;
    let from = 0; // a compacted session: the model only gets the messages from the last summary on
    for (let i = chat.messages.length - 1; i >= 0; i--) if (chat.messages[i]._summary) { from = i; break; }
    let anchor = -1;
    for (let i = chat.messages.length - 1; i >= from; i--) if (chat.messages[i]._usage && (chat.messages[i]._ctxFrom ?? 0) === from) { anchor = i; break; }
    const live = liveUsage && liveUsage.chat === chat.id ? liveUsage : null;
    let exact = 0, after = chat.messages.slice(from), conv;
    if (live) { exact = live.prompt + live.completion; after = []; }
    else if (anchor >= 0) { const u = chat.messages[anchor]._usage; exact = u.prompt + u.completion; after = chat.messages.slice(anchor + 1); }
    conv = estTokens(JSON.stringify(after.map(stripUi))) + imgTok(after) + estTokens(input.value);
    if (model && ctxSize[model] === undefined) {
      ctxSize[model] = null;
      try { ctxSize[model] = (await (await fetch("/api/ctx?model=" + encodeURIComponent(model))).json()).n_ctx; } catch {}
    }
    const total = exact ? exact + conv : sys + conv, max = ctxSize[model];
    const m = $("ctxMeter");
    m.textContent = `${exact && conv < 50 ? "" : "≈"}${fmtK(total)}${max ? " / " + fmtK(max) : ""} tok`;
    m.className = "ctx" + (max && total > max * 0.9 ? " bad" : max && total > max * 0.75 ? " warn" : "");
    m.title = (exact ? `Context use\nLast request (from llama-server): ${exact} tokens\nSince then (estimate): ≈${fmtK(conv)}`
      : `Estimated context use\nInstructions + ${specs.length} tool definitions: ≈${fmtK(sys)}\nConversation: ≈${fmtK(conv)}`) +
      (max ? `\nModel context size: ${fmtK(max)}` : "\n(Context size shows once the model is loaded)") +
      (lastUsage && lastUsage.model === model ? `\nLast request (exact): ${lastUsage.prompt} prompt + ${lastUsage.completion} reply tokens` : "");
  }, 250);
}
input.addEventListener("input", updateCtx);
// The message box grows with its text, up to about 5 lines, then scrolls.
function autosize() {
  input.style.height = "auto";
  const h = Math.min(input.scrollHeight, 124);
  input.style.height = Math.max(36, h) + "px";
  input.style.overflowY = input.scrollHeight > 124 ? "auto" : "hidden";
  updateSendState();
}
const hasDraft = () => !!(input.value.trim() || attachments.length);
function updateSendState() {
  const stopMode = running && !hasDraft();
  sendBtn.innerHTML = stopMode ? STOP_ICON : SEND_ICON;
  sendBtn.title = stopMode ? "Stop" : running ? "Send now: the model sees it after its current step" : "Send (Enter)";
  sendBtn.setAttribute("aria-label", stopMode ? "Stop" : "Send");
  sendBtn.classList.toggle("stop", stopMode); sendBtn.classList.toggle("primary", !stopMode);
  sendBtn.classList.toggle("empty", !running && !hasDraft());
}
input.addEventListener("input", autosize);
autosize();

// ---------- wiring ----------
$("form").addEventListener("submit", (e) => { e.preventDefault(); if (running) { if (hasDraft()) steer(); else stop(); } else send(); });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (running) { if (hasDraft()) steer(); } else send(); } });
window.addEventListener("hashchange", () => route());
window.addEventListener("focus", () => loadModels()); // no reload button: refresh the model list when the window regains focus
modelSel.onchange = () => {
  chat.model = modelSel.value;
  updateCtx();
  renderAttachments(); // vision note depends on the model
  if (chat.id) fetch(`/api/chats/${chat.id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: chat.model }) }).catch(() => {});
};
renderMode();

// #w/<workspace> shows a workspace, #<session id> opens a session, nothing shows Default.
async function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("w/")) { if (wsView !== h.slice(2)) await openWorkspace(h.slice(2)); }
  else if (h) { if (h !== chat.id || wsView) await loadChat(h); }
  else await openWorkspace(defaultWs);
}

(async () => {
  await Promise.all([loadModels(), loadTools(), loadList(), loadWorkspaces()]);
  renderList();
  await route();
})();
</script>
