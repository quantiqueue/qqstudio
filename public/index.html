<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>qqstudio</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#0f1115">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --side:#12151b; --line:#272b35; --text:#e6e8ee; --muted:#8a91a3; --accent:#6aa3ff; --user:#1f2a3d; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
  @media (pointer:coarse) { textarea, input, select { font-size:16px; } } /* iOS zooms into fields smaller than 16px */
  .layout { flex:1; min-height:0; display:flex; }
  select, button, textarea, input { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  button { padding:6px 14px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#0b1020; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }

  /* sidebar */
  aside { width:260px; flex:none; background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  aside .top { padding:10px; border-bottom:1px solid var(--line); }
  #newChat { width:100%; text-align:left; }
  #newChat:hover { border-color:var(--accent); }
  #chatList { flex:1; overflow-y:auto; overflow-x:hidden; padding:4px 6px 12px; }
  .group { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:12px 8px 4px; }
  .chat-item { display:flex; align-items:center; gap:2px; padding:6px 6px 6px 10px; border-radius:8px; cursor:pointer; color:#b8bdca; font-size:14px; }
  .chat-item:hover { background:var(--panel); color:var(--text); }
  .chat-item.active { background:var(--user); color:var(--text); }
  .chat-item .run-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; margin-right:6px; }
  .chat-item .run-dot.running { animation:pulse 1.2s ease-in-out infinite; }
  .chat-item .run-dot.waiting { background:#e3b04b; }
  .chat-item .run-dot.unread { background:#4fc98a; }
  @keyframes pulse { 50% { opacity:.3; } }
  .chat-item .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chat-item .act { visibility:hidden; background:none; border:none; padding:1px 5px; color:var(--muted); font-size:13px; }
  .chat-item:hover .act, .chat-item .act.armed { visibility:visible; }
  .chat-item .act:hover { color:var(--text); }
  .chat-item .act.armed { color:#f0a3aa; }
  .chat-item input { flex:1; min-width:0; padding:2px 6px; font-size:14px; }
  .empty-list { color:var(--muted); font-size:13px; padding:14px 10px; }

  /* main */
  .main { flex:1; min-width:0; display:flex; flex-direction:column; }
  header { flex:none; display:flex; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1.brand { display:flex; align-items:center; gap:8px; letter-spacing:.01em; }
  header h1.brand img { display:block; }
  header h1 { font-size:15px; margin:0 12px 0 0; font-weight:600; white-space:nowrap; }
  nav { display:flex; gap:4px; margin-right:8px; }
  nav a { color:var(--muted); text-decoration:none; padding:5px 10px; border-radius:8px; font-size:14px; }
  nav a.active, nav a:hover { color:var(--text); background:var(--bg); }
  select { padding:6px 8px; min-width:220px; max-width:340px; }
  a.toolslink { text-decoration:none; padding:5px 10px; color:var(--muted); border:1px solid var(--line); border-radius:8px; }
  a.toolslink:hover { color:var(--text); border-color:var(--accent); }
  label.opt, a.opt { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:4px; white-space:nowrap; }
  #status { color:var(--muted); font-size:13px; margin-left:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .logwrap { flex:1; min-height:0; position:relative; display:flex; flex-direction:column; }
  #log { flex:1; min-height:0; overflow-y:auto; padding:20px 16px; }
  .jump { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); z-index:5; width:32px; height:32px; padding:0; border-radius:50%; background:var(--panel); border:1px solid var(--line); color:var(--text); font-size:16px; line-height:1; box-shadow:0 2px 10px rgba(0,0,0,.45); }
  .jump:hover { border-color:var(--accent); }
  .jump[hidden] { display:none; }
  @media (hover:none) { .jump { width:40px; height:40px; } }
  #log > * { max-width:900px; margin-left:auto; margin-right:auto; }
  #log > * + * { margin-top:14px; }
  .welcome { color:var(--muted); text-align:center; margin-top:18vh !important; }
  .msg { padding:10px 14px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word; }
  .user { background:var(--user); width:fit-content; max-width:min(80%, 720px); margin-right:max(0px, calc((100% - 900px) / 2)) !important; }
  .assistant { background:var(--panel); border:1px solid var(--line); }
  .error { background:#3a1a1d; border:1px solid #6b2a30; }
  .md { white-space:normal; line-height:1.55; overflow-wrap:anywhere; }
  .md > :first-child { margin-top:0; } .md > :last-child { margin-bottom:0; }
  .md p { margin:0 0 .75em; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin:1.1em 0 .45em; line-height:1.3; font-weight:600; }
  .md h1 { font-size:1.45em; } .md h2 { font-size:1.25em; } .md h3 { font-size:1.1em; } .md h4, .md h5, .md h6 { font-size:1em; }
  .md h2 { padding-bottom:.25em; border-bottom:1px solid var(--line); }
  .md ul, .md ol { margin:0 0 .75em; padding-left:1.5em; }
  .md li { margin:.2em 0; } .md li > ul, .md li > ol { margin:.2em 0 0; } .md li > p { margin:0 0 .4em; }
  .md li.task { list-style:none; margin-left:-1.3em; } .md li.task input { margin:0 .35em 0 0; vertical-align:-1px; }
  .md a { color:var(--accent); text-decoration:none; } .md a:hover { text-decoration:underline; }
  .md strong { font-weight:600; color:#f3f4f8; }
  .md hr { border:none; border-top:1px solid var(--line); margin:1em 0; }
  .md blockquote { margin:0 0 .75em; padding:2px 0 2px 12px; border-left:3px solid var(--line); color:#b8bdca; }
  .md code { font:.9em ui-monospace,Consolas,monospace; background:#0b0d11; border:1px solid var(--line); border-radius:4px; padding:.05em .35em; }
  .md .code { margin:0 0 .75em; border:1px solid var(--line); border-radius:8px; background:#0b0d11; overflow:hidden; }
  .md .code-h { display:flex; align-items:center; justify-content:space-between; padding:3px 6px 3px 12px; font-size:12px; color:var(--muted); border-bottom:1px solid var(--line); background:#12151b; }
  .md .code-copy { background:none; border:none; padding:2px 8px; font-size:12px; color:var(--muted); border-radius:6px; cursor:pointer; }
  .md .code-copy:hover { color:var(--text); background:var(--panel); }
  .md pre { margin:0; padding:10px 12px; overflow:auto; max-height:520px; }
  .md pre code { font:12.5px/1.5 ui-monospace,Consolas,monospace; background:none; border:none; padding:0; white-space:pre; color:#c9cede; }
  .md .tbl { margin:0 0 .75em; overflow-x:auto; }
  .md table { border-collapse:collapse; font-size:.95em; }
  .md th, .md td { border:1px solid var(--line); padding:5px 10px; text-align:left; vertical-align:top; }
  .md th { background:#12151b; font-weight:600; }
  .md img { max-width:100%; max-height:420px; border-radius:8px; border:1px solid var(--line); cursor:zoom-in; vertical-align:middle; }
  .hl-kw { color:#ff7b72; } .hl-str { color:#a5d6ff; } .hl-num, .hl-lit { color:#79c0ff; } .hl-com { color:#8b949e; font-style:italic; }
  .hl-fn { color:#d2a8ff; } .hl-ty, .hl-var { color:#ffa657; } .hl-bi { color:#79c0ff; } .hl-meta { color:#d2a8ff; } .hl-tag { color:#7ee787; } .hl-attr { color:#79c0ff; }
  .hl-ins { color:#aff5b4; background:rgba(46,160,67,.15); display:inline-block; min-width:100%; } .hl-del { color:#ffdcd7; background:rgba(248,81,73,.15); display:inline-block; min-width:100%; }
  .think { color:var(--muted); font-size:13px; border-left:2px solid var(--line); padding-left:10px; margin-bottom:8px; white-space:pre-wrap; }
  .meta { color:var(--muted); font-size:12px; margin-top:6px; display:flex; align-items:center; gap:8px; min-height:22px; }
  .uwrap { display:flex; flex-direction:column; align-items:flex-end; }
  .uwrap .user { margin-right:0 !important; }
  .acts { display:flex; gap:2px; opacity:0; transition:opacity .15s; }
  .uwrap .acts { margin-top:3px; }
  .meta .acts { margin-left:auto; }
  .uwrap:hover .acts, .assistant:hover .acts, .acts:focus-within { opacity:1; }
  .acts button { background:none; border:none; padding:2px 8px; font-size:12px; color:var(--muted); border-radius:6px; }
  .acts button:hover { color:var(--text); background:var(--panel); }
  .assistant .acts button:hover { background:var(--bg); }
  /* Touch screens have no hover: always show message actions and chat delete buttons, with bigger tap targets. */
  @media (hover:none) {
    .acts { opacity:1; }
    .acts button { padding:6px 10px; font-size:13px; }
    .chat-item .act { visibility:visible; }
    .md .code-copy { padding:5px 10px; }
  }
  .phase { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }
  .phase + * { margin-top:6px; }
  .phase .spin { width:12px; height:12px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; flex:none; }
  .phase .bar { width:120px; height:4px; background:var(--bg); border-radius:2px; overflow:hidden; }
  .phase .bar > div { height:100%; background:var(--accent); width:0; transition:width .3s; }
  @keyframes spin { to { transform:rotate(360deg); } }
  details summary { cursor:pointer; color:var(--muted); font-size:13px; }
  .tool { border:1px solid var(--line); border-radius:10px; padding:6px 12px; font-size:13px; background:#12151b; }
  .tool > details > summary { list-style:none; display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--text); font-size:13px; }
  .tool > details > summary::-webkit-details-marker { display:none; }
  .tool > details > summary::before { content:"▸"; color:var(--muted); font-size:11px; width:10px; }
  .tool > details[open] > summary::before { content:"▾"; }
  .tool .name { font-family:ui-monospace,Consolas,monospace; color:var(--accent); flex:none; }
  .tool .sum { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; }
  .tool .lbl { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin-top:8px; }
  .media { margin-top:8px !important; }
  .media .imgs { margin-top:0; }
  .tool pre { margin:6px 0 0; white-space:pre-wrap; word-break:break-all; font:12px/1.45 ui-monospace,Consolas,monospace; color:#c9cede; max-height:320px; overflow:auto; }
  .tool .actions { margin-top:8px; display:flex; gap:8px; }
  .tool.denied .name { color:#d9727b; }
  .tool .badge { color:var(--muted); flex:none; }
  .imgs { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:8px; margin-top:8px; }
  .imgs.big { grid-template-columns:1fr; }
  .imgs figure { margin:0; background:#0b0d11; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .imgs img { display:block; width:100%; height:110px; object-fit:cover; cursor:zoom-in; }
  .imgs.big img { height:auto; max-height:520px; object-fit:contain; }
  .imgs figcaption { font-size:11px; color:var(--muted); padding:4px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .imgs figcaption a { color:var(--muted); }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:10; cursor:zoom-out; }
  #lightbox img { max-width:94vw; max-height:94vh; }
  form { display:flex; gap:10px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); }
  form .inner { display:flex; flex-direction:column; gap:8px; max-width:900px; width:100%; margin:0 auto; }
  .compose { display:flex; gap:10px; }
  .attachments { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .attachments .att { position:relative; width:56px; height:56px; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#0b0d11; }
  .attachments .att img { width:100%; height:100%; object-fit:cover; display:block; }
  .attachments .att.busy img { opacity:.4; }
  .attachments .att button { position:absolute; top:2px; right:2px; width:18px; height:18px; padding:0; line-height:16px; font-size:12px; border-radius:50%; background:rgba(0,0,0,.7); border:none; color:#fff; cursor:pointer; }
  .attachments .att-note { font-size:12px; color:#e3b04b; }
  form.drop .compose textarea { border-color:var(--accent); background:#141a26; }
  .uwrap .imgs { width:min(80%, 420px); }
  .compose #send { min-width:76px; }
  .toolbar { display:flex; gap:8px; align-items:center; font-size:13px; }
  .toolbar select { font-size:13px; padding:4px 8px; min-width:0; max-width:320px; }
  .toolbar button.icon { padding:3px 9px; font-size:13px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { border:none; border-radius:0; padding:4px 11px; font-size:13px; color:var(--muted); background:var(--bg); }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:#1f2a3d; color:var(--text); }
  .seg button.on[data-mode="auto"] { background:#3a2e14; color:#f0c674; }
  .toolbar .toolslink { font-size:13px; padding:4px 10px; color:var(--muted); }
  .plus-wrap { position:relative; }
  .toolbar button.plus { font-size:15px; padding:2px 10px; line-height:1.3; }
  .plus-menu { white-space:normal; overflow-x:hidden; position:absolute; bottom:calc(100% + 8px); left:0; width:380px; max-height:60vh; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.5); padding:6px 0; z-index:20; font-size:13px; }
  .plus-menu h4 { margin:8px 14px 4px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; }
  .pm-row { display:flex; align-items:center; gap:8px; padding:6px 14px; }
  .pm-row:hover { background:#1b1f27; }
  .pm-row .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pm-row .nm small { color:var(--muted); margin-left:6px; }
  .pm-row .d { width:8px; height:8px; border-radius:50%; background:var(--line); flex:none; }
  .pm-row .d.ready { background:#4fc98a; } .pm-row .d.error { background:#e06c75; } .pm-row .d.starting { background:#e3b04b; }
  .pm-row.dis { opacity:.45; }
  .pm-empty { color:var(--muted); padding:4px 14px 8px; }
  .pm-empty a, .pm-foot a { color:var(--accent); }
  .pm-foot { border-top:1px solid var(--line); margin-top:6px; padding:8px 14px 4px; color:var(--muted); }
  .mode-menu { width:300px; left:auto; right:0; } /* opens leftwards so it stays inside the window */
  .mm-row { display:flex; align-items:flex-start; gap:10px; width:100%; padding:8px 14px; border:none; border-radius:0; background:none; color:var(--text); text-align:left; font-size:13px; }
  .mm-row:hover { background:#1b1f27; }
  .mm-row.on { background:#1f2a3d; }
  .mm-row .ic { font-size:15px; line-height:1.2; }
  .mm-row small { display:block; color:var(--muted); margin-top:2px; line-height:1.35; }
  /* flat controls: no border or fill until hovered */
  .toolbar #plus, .toolbar #model, .toolbar #think, .toolbar #modeBtn { background:transparent; border-color:transparent; color:var(--muted); transition:background .12s, color .12s; }
  .toolbar #plus:hover, .toolbar #model:hover, .toolbar #think:hover, .toolbar #modeBtn:hover,
  .toolbar #plus.open, .toolbar #modeBtn.open, .toolbar #model:focus-visible, .toolbar #think:focus-visible { background:#252a35; color:var(--text); outline:none; }
  .toolbar #modeBtn { font-size:13px; padding:0 10px; }
  .toolbar #modeBtn.auto { color:#f0c674; }
  .toolbar select option { background:var(--panel); color:var(--text); }
  .seg.sm button { padding:2px 8px; font-size:12px; }
  .seg.sm button.on[data-v="pinned"] { background:#1d2b45; color:#9cc0ff; }
  .seg.sm button.on[data-v="off"] { background:#2a1d20; color:#d9a0a6; }
  .toolbar select.think-sel { min-width:0; width:auto; }
  /* one height for every control in the composer toolbar */
  .toolbar { --h:30px; }
  .toolbar select, .toolbar button.icon, .toolbar .seg, .toolbar .toolslink { height:var(--h); box-sizing:border-box; line-height:1; }
  .toolbar select { padding:0 8px; }
  .toolbar button.icon { padding:0 10px; display:inline-flex; align-items:center; justify-content:center; }
  .toolbar button.plus { padding:0 11px; font-size:15px; }
  .toolbar .seg button { height:100%; display:inline-flex; align-items:center; gap:4px; padding:0 11px; line-height:1; }
  .toolbar .toolslink { display:inline-flex; align-items:center; gap:4px; }
  .toolbar .chip { line-height:1.4; }
  /* layout: fixed-size controls never wrap; the model picker and chips give way first */
  form .inner { container-type:inline-size; }
  .toolbar { flex-wrap:nowrap; min-width:0; }
  .toolbar > * { flex:none; white-space:nowrap; }
  .toolbar select#model { flex:0 1 280px; min-width:120px; text-overflow:ellipsis; }
  .toolbar .chips { flex:1 1 0; min-width:0; }
  .toolbar .ctx { margin-left:auto; }
  @container (max-width: 520px) { .toolbar .ctx { display:none; } }
  .chips { display:flex; gap:6px; flex-wrap:nowrap; overflow:hidden; min-width:0; flex:1; }
  .chip { font-size:12px; padding:2px 8px; border-radius:20px; background:#1b1f27; border:1px solid var(--line); color:#b8bdca; white-space:nowrap; cursor:pointer; }
  .chip:hover { border-color:var(--accent); }
  .ctx { font-size:12px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .ctx.warn { color:#e3b04b; } .ctx.bad { color:#e06c75; }
  textarea { flex:1; resize:none; padding:10px; height:64px; }
</style>
</head>
<body>
<header>
  <h1 class="brand"><img src="/icon-64.png" alt="" width="22" height="22">qqstudio</h1>
  <nav><a href="/" class="active">Chat</a><a href="/settings">Settings</a></nav>
  <span id="status"></span>
</header>
<div class="layout">
<aside>
  <div class="top"><button id="newChat">＋ New chat</button></div>
  <div id="chatList"></div>
</aside>
<div class="main">
  <div class="logwrap"><div id="log"></div><button type="button" id="jump" class="jump" title="Jump to latest" hidden>↓</button></div>
  <form id="form"><div class="inner">
    <div id="attachments" class="attachments" hidden></div>
    <div class="compose">
      <textarea id="input" placeholder="Message (Enter to send, Shift+Enter for newline, paste or drop images)"></textarea>
      <button type="submit" class="primary" id="send">Send</button>
    </div>
    <div class="toolbar">
      <div class="plus-wrap">
        <button type="button" id="plus" class="icon plus" title="Skills, MCP servers and tools for this chat">＋</button>
        <div id="plusMenu" class="plus-menu" hidden></div>
      </div>
      <select id="model" title="Model for this chat"><option>loading…</option></select>
      <select id="think" class="think-sel" title="Thinking effort for this chat">
        <option value="default">Default</option>
        <option value="off">Off</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
        <option value="max">Max</option>
      </select>
      <div class="plus-wrap">
        <button type="button" id="modeBtn" class="icon mode-btn" title="Tool approval for this chat"></button>
        <div id="modeMenu" class="plus-menu mode-menu" hidden></div>
      </div>
      <span id="ctxMeter" class="ctx" title="Estimated context use"></span>
    </div>
  </div></form>
</div>
</div>
<div id="lightbox"><img alt=""></div>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), sendBtn = $("send"), modelSel = $("model"), status = $("status");
const MAX_STEPS = 25;

// chat = { id, title, created, updated, model, messages[] }
// messages are OpenAI-format; keys starting with "_" are UI-only (reasoning, meta, images, status) and are
// stripped before sending to the model.
let chat = blankChat();
let chatList = [];
let renaming = false;
let running = false, pendingApproval = null, listTimer = null;
let toolInfo = { enabled: true, tools: [], roots: [], platform: "" };

function blankChat() { return { id: null, title: "New chat", mode: "manual", think: "default", skills: {}, mcp: {}, cats: {}, messages: [] }; }
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function el(tag, cls, text) { const d = document.createElement(tag); if (cls) d.className = cls; if (text != null) d.textContent = text; return d; }
function add(node) { log.querySelector(".welcome")?.remove(); log.appendChild(node); follow(); return node; }
// ---------- scroll: follow new output only while the user is at the bottom ----------
// Scrolling up (wheel, touch, scrollbar, keys) stops following; getting back to the bottom, or the ↓ button, resumes it.
// Only a *decrease* in scrollTop counts as the user leaving, so content growing under a programmatic scroll can't unstick it.
let stick = true, lastTop = 0;
const jumpBtn = document.getElementById("jump");
const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 40;
function updJump() { jumpBtn.hidden = stick || nearBottom(); }
function follow() {
  if (!stick) { updJump(); return; }
  log.scrollTop = log.scrollHeight;
  requestAnimationFrame(() => { if (stick) log.scrollTop = log.scrollHeight; updJump(); }); // markdown renders on the next frame
}
function toBottom() { stick = true; follow(); }
log.addEventListener("scroll", () => {
  const t = log.scrollTop;
  if (t < lastTop - 1) stick = false; else if (nearBottom()) stick = true;
  lastTop = t; updJump();
}, { passive: true });
log.addEventListener("wheel", (e) => { // reacts before a streaming delta can scroll back down
  if (e.deltaY >= 0 || log.scrollTop <= 0) return;
  for (let n = e.target; n && n !== log; n = n.parentElement) if (n.scrollTop > 0 && n.scrollHeight > n.clientHeight) return; // an inner box scrolls instead
  stick = false; updJump();
}, { passive: true });
jumpBtn.addEventListener("click", () => { stick = true; log.scrollTo({ top: log.scrollHeight, behavior: "smooth" }); jumpBtn.hidden = true; });
function setHash(id) { window.history.replaceState(null, "", id ? "#" + id : location.pathname); }

// ---------- per-chat thinking level ----------

function thinkParams(level) {
  if (!level || level === "default") return { budget: null, body: {} };
  if (level === "off") return { budget: 0, body: { chat_template_kwargs: { enable_thinking: false }, reasoning_budget_tokens: 0, thinking_budget_tokens: 0 } };
  const budget = level === "max" ? -1 : thinkCfg.budgets[level];
  const body = { chat_template_kwargs: { reasoning_effort: level === "max" ? "high" : level }, reasoning_budget_tokens: budget, thinking_budget_tokens: budget };
  if (budget > 0 && thinkCfg.message) body.reasoning_budget_message = thinkCfg.message;

}

}

// ---------- models / tools ----------
async function loadModels() {
  status.textContent = "loading models…";
  try {
    const r = await fetch("/api/models");
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    const prev = chat.model || modelSel.value;
    modelSel.innerHTML = "";
    modelVision = {};
    for (const m of j.models) {
      modelVision[m.id] = !!m.vision;
      const o = el("option", null, (m.vision ? "👁 " : "") + (m.status ? `${m.id}  (${m.status})` : m.id));
      if (m.vision) o.title = "Can see images";
      o.value = m.id;
      modelSel.appendChild(o);
    }
    if ([...modelSel.options].some((o) => o.value === prev)) modelSel.value = prev;
    status.textContent = j.models.length ? `${j.models.length} model(s)` : "no models reported";
  } catch (e) {
    modelSel.innerHTML = "<option value=''>(unavailable)</option>";
    status.textContent = e.message;
  }
}
let modelVision = {};

// ---------- pasted / dropped images ----------
let attachments = []; // [{src, busy, preview}]
function renderAttachments() {
  const box = $("attachments");
  box.hidden = !attachments.length;
  box.innerHTML = "";
  for (const a of attachments) {
    const d = box.appendChild(el("div", "att" + (a.busy ? " busy" : "")));
    const img = d.appendChild(el("img")); img.src = a.preview || a.src; img.alt = "";
    const x = d.appendChild(el("button", null, "×")); x.type = "button"; x.title = "Remove";
    x.onclick = () => { attachments = attachments.filter((b) => b !== a); renderAttachments(); };
  }
  if (attachments.length && !modelVision[modelSel.value])
    box.appendChild(el("div", "att-note", "This model can't see images; only the text will be used."));
}
async function attachImage(blob) {
  if (!/^image\/(png|jpeg|gif|webp|bmp)$/.test(blob.type)) { status.textContent = "Only PNG, JPEG, GIF, WebP or BMP images can be attached."; return; }
  const a = { busy: true, preview: URL.createObjectURL(blob) };
  attachments.push(a); renderAttachments();
  try {
    const r = await fetch("/api/uploads", { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    a.src = j.src; a.busy = false;
  } catch (e) {
    attachments = attachments.filter((b) => b !== a);
    status.textContent = "Could not attach image: " + e.message;
  }
  renderAttachments();
}
input.addEventListener("paste", (e) => {
  const files = [...(e.clipboardData?.items || [])].filter((i) => i.kind === "file" && i.type.startsWith("image/")).map((i) => i.getAsFile()).filter(Boolean);
  if (!files.length) return; // plain text paste
  e.preventDefault();
  files.forEach(attachImage);
});
const formEl = $("form");
formEl.addEventListener("dragover", (e) => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); formEl.classList.add("drop"); } });
formEl.addEventListener("dragleave", (e) => { if (!formEl.contains(e.relatedTarget)) formEl.classList.remove("drop"); });
formEl.addEventListener("drop", (e) => {
  formEl.classList.remove("drop");
  const files = [...e.dataTransfer.files].filter((f) => f.type.startsWith("image/"));

let skillList = [], mcpServers = [];

  const [t, sk, mc] = await Promise.all([

    fetch("/api/skills").then((r) => r.json()).catch(() => null),
    fetch("/api/mcp").then((r) => r.json()).catch(() => null),
  ]);
  if (t) toolInfo = t;

// Per-chat view of skills / MCP servers / tool categories (defaults: everything allowed in Settings is on).
const skillMode = (name) => (chat.skills || {})[name] || "auto";
const mcpOn = (server) => (chat.mcp || {})[server] !== false;
const catOn = (cat) => (chat.cats || {})[cat] !== false;
function activeTools() {
  if (toolInfo.enabled === false) return [];
  const autoSkills = skillList.some((s) => skillMode(s.name) === "auto");
  return toolInfo.tools.filter((t) => {
    if (!t.enabled) return false;
    if (t.server) return mcpOn(t.server);
    if (t.name === "load_skill") return autoSkills;
    return catOn(t.category);
  });
}
function renderToolbarState() {
  const n = toolInfo.enabled === false ? 0 : activeTools().length;
  $("plus").title = `Skills, MCP servers and tools for this chat (${n} tool${n === 1 ? "" : "s"} active)`;
  updateCtx();
}

function systemPrompt(specs = activeTools(), pinned = []) {
  const win = toolInfo.platform === "win32";
  const on = new Set(specs.map((t) => t.name));
  const has = (...n) => n.some((x) => on.has(x));
  const lines = [`You are a helpful assistant running on the user's ${win ? "Windows" : toolInfo.platform} computer.`];
  const fileOps = [["list_dir", "list folders"], ["read_file", "read files"], ["search_files", "search for files"], ["write_file", "write files"],
    ["move_file", "move or rename files"], ["delete_file", "delete files"]].filter(([n]) => on.has(n)).map(([, d]) => d);
  if (fileOps.length) {
    lines.push(`You have tools to ${fileOps.join(", ")} in these folders: ${toolInfo.roots.join(", ")}.`);
    lines.push(`When the user asks about files or folders, call the tools yourself instead of telling the user how to do it. Use absolute ${win ? "Windows " : ""}paths.`);
  }
  if (has("web_search", "fetch_url", "download_file")) {
    const w = [["web_search", "search the web (web_search)"], ["fetch_url", "read web pages (fetch_url)"], ["download_file", "download files (download_file)"]]
      .filter(([n]) => on.has(n)).map(([, d]) => d);
    lines.push(`You can ${w.join(", ")}. Use them for anything current or that you are unsure about, and mention the URLs you used.`);
  }
  if (has("image_search", "show_image")) {
    const im = [on.has("image_search") && "image_search (thumbnails are displayed automatically)", on.has("show_image") && "show_image for a specific image URL or local file"].filter(Boolean);
    lines.push(`To show the user pictures, use ${im.join(" or ")}.`);
  }
  if (on.has("run_command")) lines.push(`You can run ${win ? "cmd.exe" : "shell"} commands with run_command; use it when no specific tool fits.`);
  const servers = [...new Set(specs.filter((t) => t.server).map((t) => t.server))];
  if (servers.length) lines.push(`You also have tools from connected services: ${servers.join(", ")} (tool names start with the service name).`);
  if (on.size) {
    lines.push("Only use the tools listed to you. Never say you cannot do something a tool can do.");
    if (specs.some((t) => t.approval) && chat.mode !== "auto") lines.push("Some actions ask the user for approval automatically, so just call the tool.");
    lines.push("If a tool returns an error, read it and try a corrected call.");
  } else lines.push("You have no tools available; answer from your own knowledge.");
  lines.push("After you have what you need, answer concisely.");
  let out = lines.join(" ");
  const auto = on.has("load_skill") ? skillList.filter((s) => skillMode(s.name) === "auto") : [];
  if (auto.length) out += "\n\nSkills you can use. Before doing a task that matches one, call load_skill with its name and follow the instructions:\n" +
    auto.map((s) => `- ${s.name}: ${s.description || "(no description)"}`).join("\n");
  for (const p of pinned) out += `\n\n# Skill: ${p.name}\nFollow these instructions whenever they apply.\n\n${p.body}` +
    (p.files?.length ? `\n\nFiles in this skill (folder ${p.dir}):\n${p.files.map((f) => "- " + p.dir + (toolInfo.platform === "win32" ? "\\" : "/") + f).join("\n")}` : "");
  return out;
}

function assistantBox() {
  const box = add(el("div", "msg assistant"));
  const contentEl = box.appendChild(el("div", "md"));

    if (!phaseEl) return;
    const secs = Math.floor((performance.now() - phaseT0) / 1000);
    phaseEl.querySelector(".txt").textContent = phaseText + "…" + (secs >= 1 ? ` ${secs}s` : "");
    const bar = phaseEl.querySelector(".bar");
    bar.style.display = phasePct == null ? "none" : "";
    if (phasePct != null) bar.firstChild.style.width = phasePct + "%";
  };
  return {
    // Status line shown until the reply text starts streaming.
    phase(text, pct = null) {
      if (!phaseEl) {
        phaseEl = el("div", "phase");
        phaseEl.appendChild(el("span", "spin"));
        phaseEl.appendChild(el("span", "txt"));
        phaseEl.appendChild(el("span", "bar")).appendChild(el("div"));

    clearPhase() { clearInterval(phaseTimer); phaseTimer = null; phaseEl?.remove(); phaseEl = null; phaseText = ""; },

// Tools whose only job is to display something: when they succeed, show just the result (no tool line).
const QUIET_TOOLS = new Set(["show_image"]);

// Compact tool line: "▸ name  summary · status"; arguments and result fold out. Images go in the conversation below it.
function argSummary(argsText) {
  let o;
  try { o = JSON.parse(argsText || "{}"); } catch { return String(argsText || "").slice(0, 120); }
  if (!o || typeof o !== "object") return String(o);
  return Object.entries(o).map(([k, v]) => {
    const t = typeof v === "string" ? v : JSON.stringify(v);
    return Object.keys(o).length === 1 ? t : `${k}: ${t}`;
  }).join(" · ").replace(/\s+/g, " ").slice(0, 160);
}
function toolCard(name, argsText) {
  const card = add(el("div", "tool"));
  const det = card.appendChild(el("details"));
  const sum = det.appendChild(el("summary"));
  sum.appendChild(el("span", "name", name));
  sum.appendChild(el("span", "sum", argSummary(argsText))).title = argSummary(argsText);
  const badgeEl = sum.appendChild(el("span", "badge"));
  det.appendChild(el("div", "lbl", "Arguments"));
  det.appendChild(el("pre", null, prettyArgs(argsText)));
  return {
    hide() { card.remove(); },
    badge(t) { badgeEl.textContent = t ? "· " + t : ""; card.classList.toggle("denied", t === "denied"); },
    result(text, images) {
      det.appendChild(el("div", "lbl", `Result (${text.length} chars)`));
      det.appendChild(el("pre", null, text.length > 6000 ? text.slice(0, 6000) + "\n…" : text));
      if (images && images.length) {
        const media = add(el("div", "media"));
        media.appendChild(renderImages(images, images.some((i) => i.big)));
      }
    },
    approve() {
      det.open = true; // show the arguments while asking
      return new Promise((resolve) => {
        const actions = card.appendChild(el("div", "actions"));
        const yes = actions.appendChild(el("button", "primary", "Allow"));
        const no = actions.appendChild(el("button", null, "Deny"));
        const done = (ok) => { actions.remove(); det.open = false; pendingApproval = null; resolve(ok); };
        yes.onclick = () => done(true); no.onclick = () => done(false);
        pendingApproval = done;
        follow();
      });
    },
  };
}

async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = el("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  const old = btn.textContent; btn.textContent = "✓ Copied";
  setTimeout(() => (btn.textContent = old), 1200);
}

function userBubble(msg) {
  const w = add(el("div", "uwrap"));
  if (msg._images?.length) w.appendChild(renderImages(msg._images, msg._images.length === 1));
  if (msg.content || !msg._images?.length) w.appendChild(el("div", "msg user", msg.content));
  const acts = w.appendChild(el("div", "acts"));
  const cp = acts.appendChild(el("button", null, "⧉ Copy")); cp.type = "button"; cp.title = "Copy prompt";
  cp.onclick = () => copyText(msg.content, cp);
  const rt = acts.appendChild(el("button", null, "↻ Retry")); rt.type = "button"; rt.title = "Discard everything after this prompt and run it again";
  rt.onclick = () => retry(msg);
  return w;
}

// live = true while a run is going: tool calls still waiting for a result get a card the run events will fill in.
function renderChat(live = false) {
  log.innerHTML = "";
  cards = new Map();
  if (!chat.messages.length) return showWelcome();
  const results = new Map(chat.messages.filter((m) => m.role === "tool").map((m) => [m.tool_call_id, m]));
  for (const m of chat.messages) {
    if (m.role === "user") userBubble(m);
    else if (m.role === "assistant") {
      if (m.content || m._reasoning) {
        const b = assistantBox();
        if (m._reasoning) { b.thinking(m._reasoning); b.setThinkSecs(m._thinkSecs ?? null); b.setBudgetHit(!!m._budgetHit); }
        b.content(m.content || "");
        b.finish(m.content || "", m._meta);
      }
      for (const tc of m.tool_calls || []) {
        const t = toolCard(tc.function.name, tc.function.arguments);
        const r = results.get(tc.id);
        if (!r) { if (live) { cards.set(tc.id, t); t.badge("waiting"); } else t.badge("no result"); continue; }
        t.badge(r._status || "done");
        if (r._status !== "denied" && r._status !== "cancelled") t.result(r.content, r._images);
        if (QUIET_TOOLS.has(tc.function.name) && (r._status || "done") === "done" && r._images?.length) t.hide();
      }
    }
  }
  toBottom();
}

// ---------- chat persistence ----------
async function loadList() {
  try { chatList = (await (await fetch("/api/chats")).json()).chats || []; } catch { chatList = []; }
  if (!renaming) renderList();
  clearTimeout(listTimer); // keep the sidebar's "reply in progress" dots current
  if (chatList.some((c) => c.running)) listTimer = setTimeout(loadList, 3000);
}

async function saveChat(c = chat) {
  if (!c.id) { c.id = newId(); c.created = Date.now(); if (c === chat) setHash(c.id); }
  c.updated = Date.now();
  c.model = modelSel.value || c.model;
  try {
    await fetch(`/api/chats/${c.id}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(c) });
  } catch (e) { status.textContent = "save failed: " + e.message; }
  loadList();
}


async function newChat() {
  detach(); // a running reply keeps going on the server
  chat = blankChat();
  renderMode();
  renderThink();
  renderToolbarState();
  setHash("");
  showWelcome();
  renderList();
  input.focus();
}

async function loadChat(id) {
  detach();
  try {
    const r = await fetch(`/api/chats/${id}`);
    if (!r.ok) throw new Error("not found");
    chat = await r.json();
  } catch (e) {
    status.textContent = "Could not open chat: " + e.message;
    return newChat();
  }
  setHash(chat.id);
  if (chat.unread) { delete chat.unread; fetch(`/api/chats/${chat.id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ unread: false }) }).then(loadList).catch(() => {}); }
  renderMode();
  renderThink();
  renderToolbarState();
  if (chat.model && [...modelSel.options].some((o) => o.value === chat.model)) modelSel.value = chat.model;
  renderChat();
  renderList();
  input.focus();
  const { active = [] } = await fetch("/api/runs").then((r) => r.json()).catch(() => ({}));
  if (active.includes(id) && chat.id === id) attach(id);
}

async function deleteChat(id) {
  await stopAndWait(id);
  await fetch(`/api/chats/${id}`, { method: "DELETE" }).catch(() => {});
  if (id === chat.id) await newChat();
  loadList();
}

function startRename(item, c) {
  renaming = true;
  const span = item.querySelector(".t");
  const inp = el("input"); inp.value = c.title || "";
  span.replaceWith(inp);
  item.querySelectorAll(".act").forEach((b) => (b.style.display = "none"));
  inp.focus(); inp.select();
  let done = false;
  const finish = async (save) => {
    if (done) return; done = true; renaming = false;
    const title = inp.value.trim();
    if (save && title && title !== c.title) {
      await fetch(`/api/chats/${c.id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title }) });
      if (c.id === chat.id) chat.title = title;
    }
    loadList();
  };
  inp.onkeydown = (e) => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); };
  inp.onblur = () => finish(true);
  inp.onclick = (e) => e.stopPropagation();
}

function renderList() {
  const list = $("chatList");
  list.innerHTML = "";
  if (!chatList.length) { list.appendChild(el("div", "empty-list", "No chats yet.")); return; }
  const d = new Date(), today = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(), day = 864e5;
  const groupOf = (t) => t >= today ? "Today" : t >= today - day ? "Yesterday" : t >= today - 6 * day ? "Previous 7 days" : t >= today - 29 * day ? "Previous 30 days" : "Older";
  let last = null;
  for (const c of chatList) {
    const g = groupOf(c.updated || 0);
    if (g !== last) { list.appendChild(el("div", "group", g)); last = g; }
    const item = el("div", "chat-item" + (c.id === chat.id ? " active" : ""));
    const t = item.appendChild(el("span", "t", c.title || "Untitled")); t.title = c.title || "";
    // Pulsing blue: reply in progress · yellow: waiting for you (approval) · green: finished, not read yet
    const dot = c.waiting ? ["waiting", "Waiting for your approval"] : c.running ? ["running", "Reply in progress"] : c.unread && c.id !== chat.id ? ["unread", "New reply"] : null;
    if (dot) { const sp = el("span", "run-dot " + dot[0]); sp.title = dot[1]; item.insertBefore(sp, t); }
    const ren = item.appendChild(el("button", "act", "✎")); ren.title = "Rename";
    const del = item.appendChild(el("button", "act", "🗑")); del.title = "Delete";
    item.onclick = () => { if (c.id !== chat.id) loadChat(c.id); };
    t.ondblclick = (e) => { e.stopPropagation(); startRename(item, c); };
    ren.onclick = (e) => { e.stopPropagation(); startRename(item, c); };
    del.onclick = (e) => {
      e.stopPropagation();
      if (del.classList.contains("armed")) return deleteChat(c.id);
      del.classList.add("armed"); del.textContent = "Delete?";
      setTimeout(() => { del.classList.remove("armed"); del.textContent = "🗑"; }, 3000);
    };
    list.appendChild(item);
  }
}

// ---------- agent runs ----------
// The loop runs on the server (runs.js), so a reply survives switching chats, opening Settings or closing the tab.
// This page starts a run, watches it through an event stream (EventSource), answers approvals and can stop it.
let es = null, live = null, cards = new Map();

function setBusy(busy) {
  window.harnessBusy = busy;
  if (!busy && window.harnessReloadPending) return location.reload(); // hot reload deferred during a reply
  sendBtn.textContent = busy ? "Stop" : "Send";
  sendBtn.classList.toggle("primary", !busy);
  modelSel.disabled = busy;
}

// Stop watching (the run itself keeps going on the server).
function detach() {
  if (es) { es.close(); es = null; }
  live = null; pendingApproval = null; running = false;
  setBusy(false);
}

function attach(id) {
  if (es) es.close();
  const src = new EventSource(`/api/runs/${encodeURIComponent(id)}/events`);
  es = src; running = true; setBusy(true);
  src.onmessage = (e) => {
    if (es !== src || chat.id !== id) return;
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    onRunEvent(ev, id);
  };
  // CLOSED = no run any more (204) or the server is gone for good; show what was saved.
  src.onerror = () => { if (es === src && src.readyState === EventSource.CLOSED) { es = null; endRun(id, true); } };
}

async function endRun(id, reload) {
  live = null; pendingApproval = null; running = false;
  setBusy(false);
  loadList();
  if (reload && chat.id === id) {
    try { const c = await (await fetch(`/api/chats/${id}`)).json(); if (chat.id === id) { chat.messages = c.messages || []; renderChat(); } } catch {}
  }
  if (chat.id === id) input.focus();
}

function liveStep() {
  live = live || {};
  live.box = assistantBox(); live.content = ""; live.reasoning = "";
  return live.box;
}
function tcById(id) {
  for (const m of chat.messages) for (const tc of m.tool_calls || []) if (tc.id === id) return tc;
  return { id, function: { name: "tool", arguments: "" } };
}
function liveTool(tc, status) {
  let t = cards.get(tc.id);
  if (!t) { t = toolCard(tc.function.name, tc.function.arguments); cards.set(tc.id, t); }
  if (status === "approval" && !t.asking) {
    t.asking = true;
    t.badge("needs approval");
    const id = chat.id;
    t.approve().then((ok) => {
      t.asking = false;
      if (ok) t.badge("running…");
      fetch(`/api/runs/${encodeURIComponent(id)}/approve`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: tc.id, approved: ok }) }).catch(() => {});
    });
  } else if (status === "running") t.badge("running…");
  return t;
}

function onRunEvent(ev, id) {
  switch (ev.type) {
    case "snapshot": {
      chat.messages = ev.messages || [];
      renderChat(true);
      live = {};
      if (ev.cur) {
        const b = liveStep();
        live.content = ev.cur.content || ""; live.reasoning = ev.cur.reasoning || "";
        if (live.reasoning) b.thinking(live.reasoning);
        if (live.content) b.content(live.content);
        else if (ev.cur.phase) b.phase(ev.cur.phase, ev.cur.pct);
      }
      if (ev.tool) liveTool(ev.tool.tc, ev.tool.status);
      break;
    }
    case "step": liveStep().phase("Sending request"); break;
    case "phase": if (live?.box && !live.content) live.box.phase(ev.text, ev.pct); break;
    case "delta": {
      const b = live?.box || liveStep();
      if (ev.r) { live.reasoning += ev.r; b.thinking(live.reasoning); }
      if (ev.c) { live.content += ev.c; b.content(live.content); b.clearPhase(); }
      follow();
      break;
    }
    case "assistant": {
      const m = ev.msg;
      chat.messages.push(m);
      const b = live?.box || liveStep();
      if (m._thinkSecs != null) b.setThinkSecs(m._thinkSecs);
      b.setBudgetHit(!!m._budgetHit);
      b.finish(m.content || "", m._meta);
      live.box = null;
      break;
    }
    case "failed": (live?.box || liveStep()).error(ev.text); if (live) live.box = null; break;
    case "tool": liveTool(ev.tc, ev.status); break;
    case "tool_result": {
      const m = ev.msg;
      chat.messages.push(m);
      const t = liveTool(tcById(m.tool_call_id));
      const st = m._status || "done";
      t.badge(st);
      if (st !== "denied" && st !== "cancelled") t.result(m.content, m._images);
      if (QUIET_TOOLS.has(tcById(m.tool_call_id).function.name) && st === "done" && m._images?.length) t.hide();
      follow();
      break;
    }
    case "notice": add(el("div", "msg error", ev.text)); break;
    case "usage": lastUsage = { prompt: ev.prompt, completion: ev.completion, model: ev.model }; updateCtx(); break;
    case "done": if (es) { es.close(); es = null; } endRun(id, false); break;
  }
}

async function startRun(c) {
  running = true; setBusy(true);
  try {
    await saveChat(c);
    await loadTools(); // pick up changes made in Settings
    const specs = activeTools();
    const pinned = (await Promise.all(skillList.filter((x) => skillMode(x.name) === "pinned")
      .map((x) => fetch("/api/skills/get?name=" + encodeURIComponent(x.name)).then((r) => (r.ok ? r.json() : null)).catch(() => null)))).filter(Boolean);
    const tp = thinkParams(c.think);
    const r = await fetch("/api/runs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
      chatId: c.id, model: modelSel.value, system: systemPrompt(specs, pinned), tools: specs.map((s) => s.spec),
      think: { body: tp.body, budget: tp.budget, message: thinkCfg.message },
    }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText);
    if (chat.id === c.id) attach(c.id); else { running = false; setBusy(false); }
    loadList();
  } catch (e) {
    add(el("div", "msg error", "Could not start the reply: " + e.message));
    running = false; setBusy(false);
  }
}

async function send() {
  const text = input.value.trim();
  if (attachments.some((a) => a.busy)) { status.textContent = "Waiting for the image to finish attaching…"; return; }
  const imgs = attachments.map((a) => ({ src: a.src, full: a.src }));
  if ((!text && !imgs.length) || running) return;
  input.value = "";
  attachments = []; renderAttachments();
  const c = chat;
  if (!c.messages.some((m) => m.role === "user")) c.title = (text || "Image").replace(/\s+/g, " ").slice(0, 60);
  const um = { role: "user", content: text };
  if (imgs.length) um._images = imgs;
  c.messages.push(um);
  userBubble(um);
  toBottom();
  await startRun(c);
}

// Retry: drop everything after this prompt and run it again.
async function retry(msg) {
  await stopAndWait();
  const c = chat;
  const i = c.messages.indexOf(msg);
  if (i < 0) return;
  c.messages = c.messages.slice(0, i + 1);
  renderChat();
  await startRun(c);
}

function stop() {
  if (pendingApproval) pendingApproval(false);
  if (chat.id) fetch(`/api/runs/${encodeURIComponent(chat.id)}/stop`, { method: "POST" }).catch(() => {});
}
// Stops this chat's run on the server and waits until it has finished saving.
async function stopAndWait(id = chat.id) {
  if (!id) return;
  await fetch(`/api/runs/${encodeURIComponent(id)}/stop`, { method: "POST" }).catch(() => {});
  for (let i = 0; i < 200; i++) {
    const { active = [] } = await fetch("/api/runs").then((r) => r.json()).catch(() => ({}));
    if (!active.includes(id)) break;
    await new Promise((r) => setTimeout(r, 100));
  }
  if (chat.id === id) detach();
}

// ---------- + menu (per-chat skills / MCP / tool categories) ----------
function patchChat(fields) {
  Object.assign(chat, fields);
  if (chat.id) fetch(`/api/chats/${chat.id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(fields) }).catch(() => {});
  renderToolbarState();
  renderPlus();
}
function togglePlus(force) {
  const m = $("plusMenu");
  const open = force ?? m.hidden;
  if (open) toggleMode(false);
  m.hidden = !open;
  $("plus").classList.toggle("open", open);
  if (open) { renderPlus(); loadTools().then(renderPlus); }
}
function seg(values, current, onPick) {
  const g = el("div", "seg sm");
  for (const [v, label, title] of values) {
    const b = g.appendChild(el("button", v === current ? "on" : "", label));
    b.type = "button"; b.dataset.v = v; b.title = title;
    b.onclick = (e) => { e.stopPropagation(); onPick(v); };
  }
  return g;
}
function renderPlus() {
  const m = $("plusMenu");
  if (m.hidden) return;
  m.innerHTML = "";
  m.appendChild(el("h4", null, "Skills"));
  if (!skillList.length) { const e = m.appendChild(el("div", "pm-empty")); e.innerHTML = 'No skills enabled. <a href="/settings#skills">Add skills</a>'; }
  for (const s of skillList) {
    const r = m.appendChild(el("div", "pm-row"));
    const nm = r.appendChild(el("span", "nm", s.name)); nm.title = s.description;
    r.appendChild(seg([["pinned", "📌 Pin", "Always include the full instructions"], ["auto", "Auto", "Model loads it when relevant"], ["off", "Off", "Not available in this chat"]],
      skillMode(s.name), (v) => patchChat({ skills: { ...(chat.skills || {}), [s.name]: v } })));
  }
  m.appendChild(el("h4", null, "MCP servers"));
  if (!mcpServers.length) { const e = m.appendChild(el("div", "pm-empty")); e.innerHTML = 'None configured. <a href="/settings#mcp">Add MCP servers</a>'; }
  for (const sv of mcpServers) {
    const r = m.appendChild(el("label", "pm-row" + (sv.status === "ready" ? "" : " dis")));
    const cb = r.appendChild(el("input")); cb.type = "checkbox"; cb.checked = mcpOn(sv.name);
    cb.onchange = () => patchChat({ mcp: { ...(chat.mcp || {}), [sv.name]: cb.checked } });
    r.appendChild(el("span", "d " + sv.status));
    const nm = r.appendChild(el("span", "nm", sv.name));
    nm.appendChild(el("small", null, sv.status === "ready" ? `${sv.tools.length} tools` : sv.status));
  }
  m.appendChild(el("h4", null, "Tools"));
  const cats = ["File Access", "Web", "Images", "System"];
  for (const cat of cats) {
    const inCat = toolInfo.tools.filter((t) => !t.server && t.category === cat);
    const allowed = inCat.filter((t) => t.enabled).length;
    const r = m.appendChild(el("label", "pm-row" + (allowed && toolInfo.enabled !== false ? "" : " dis")));
    const cb = r.appendChild(el("input")); cb.type = "checkbox"; cb.checked = catOn(cat); cb.disabled = !allowed || toolInfo.enabled === false;
    cb.onchange = () => patchChat({ cats: { ...(chat.cats || {}), [cat]: cb.checked } });
    const nm = r.appendChild(el("span", "nm", cat));
    nm.appendChild(el("small", null, allowed ? `${allowed} tool${allowed > 1 ? "s" : ""}` : "off in Settings"));
  }
  const f = m.appendChild(el("div", "pm-foot"));
  f.innerHTML = 'These apply to this chat only. Manage what is installed in <a href="/settings#tools">Settings</a>.';
}
$("plus").onclick = (e) => { e.stopPropagation(); togglePlus(); };
$("plusMenu").onclick = (e) => e.stopPropagation();
document.addEventListener("click", () => { if (!$("plusMenu").hidden) togglePlus(false); if (!$("modeMenu").hidden) toggleMode(false); });
document.addEventListener("keydown", (e) => { if (e.key !== "Escape") return; if (!$("plusMenu").hidden) togglePlus(false); if (!$("modeMenu").hidden) toggleMode(false); });

// ---------- context meter ----------
let lastUsage = null, ctxSize = {}, ctxTimer = null;
const estTokens = (str) => Math.ceil(str.length / 3.6);
const fmtK = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n));
function updateCtx() {
  clearTimeout(ctxTimer);
  ctxTimer = setTimeout(async () => {
    const specs = activeTools();
    const pinnedChars = skillList.filter((s) => skillMode(s.name) === "pinned").length * 1500; // rough until loaded
    const sys = estTokens(systemPrompt(specs, [])) + estTokens(JSON.stringify(specs.map((t) => t.spec))) + Math.ceil(pinnedChars / 3.6);
    const conv = estTokens(JSON.stringify(chat.messages.map(stripUi))) + estTokens(input.value);
    const model = modelSel.value;
    if (model && ctxSize[model] === undefined) {
      ctxSize[model] = null;
      try { ctxSize[model] = (await (await fetch("/api/ctx?model=" + encodeURIComponent(model))).json()).n_ctx; } catch {}
    }
    const total = sys + conv, max = ctxSize[model];
    const m = $("ctxMeter");
    m.textContent = `≈${fmtK(total)}${max ? " / " + fmtK(max) : ""} tok`;
    m.className = "ctx" + (max && total > max * 0.9 ? " bad" : max && total > max * 0.75 ? " warn" : "");
    m.title = `Estimated context use\nInstructions + ${specs.length} tool definitions: ≈${fmtK(sys)}\nConversation: ≈${fmtK(conv)}` +
      (max ? `\nModel context size: ${fmtK(max)}` : "\n(Context size shows once the model is loaded)") +
      (lastUsage && lastUsage.model === model ? `\nLast request (exact): ${lastUsage.prompt} prompt + ${lastUsage.completion} reply tokens` : "");
  }, 250);
}
input.addEventListener("input", updateCtx);

// ---------- wiring ----------
$("form").addEventListener("submit", (e) => { e.preventDefault(); if (running) stop(); else send(); });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!running) send(); } });
$("newChat").onclick = newChat;
window.addEventListener("focus", () => loadModels()); // no reload button: refresh the model list when the window regains focus
modelSel.onchange = () => {
  chat.model = modelSel.value;
  updateCtx();
  renderAttachments(); // vision note depends on the model
  if (chat.id) fetch(`/api/chats/${chat.id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: chat.model }) }).catch(() => {});
};
renderMode();

(async () => {
  await Promise.all([loadModels(), loadTools(), loadList()]);
  const id = location.hash.slice(1);
  if (id) await loadChat(id); else showWelcome();
  input.focus();
})();
</script>
